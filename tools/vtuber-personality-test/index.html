                    artstyle: '夸张抽象画风，扭曲表情，霓虹色彩，随性涂鸦线条'
                }
            ]
        },
        // Special result for random clicking (failed integrity check)
        troll: {
            type: '整蛊小丑',
            icon: '🤡',
            color: '#FF1744',
            colorName: '小丑红 #FF1744',
            variants: [
                {
                    name: '整蛊小丑',
                    desc: '乱选的产物',
                    catchphrase: '你就不能认真选吗？！',
                    artstyle: '夸张马戏团风，红鼻子，花里胡哨服装，彩色气球环绕'
                }
            ]
        }
    };

    // ── State ──
    let currentMode = 'normal';
    let questions = [];
    let currentQuestion = 0;
    let answers = [];        // 'A' | 'B' | 'C' | 'D' (single) or array of letters (multi)
    let currentSelections = []; // for multi-select
    let isMultiSelect = false;
    let displayTotal = 12;  // visible question count (excludes integrity checks)
    let currentResult = null; // { typeKey, variant, ... }

    // ── Screens ──
    const screens = {
        welcome: document.getElementById('screen-welcome'),
        question: document.getElementById('screen-question'),
        result: document.getElementById('screen-result')
    };

    function showScreen(name) {
        Object.values(screens).forEach(s => s.classList.remove('active'));
        screens[name].classList.add('active');
        if (name === 'result') {
            // Force re-trigger animation
            const card = document.getElementById('result-card');
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = '';
        }
    }

    // ── Counter (localStorage pseudo-count, starts at 256) ──
    const COUNTER_KEY = 'vtuber_test_count';
    function getAndIncrementCounter() {
        let count = parseInt(localStorage.getItem(COUNTER_KEY)) || 256;
        count++;
        localStorage.setItem(COUNTER_KEY, count);
        return count;
    }
    function getCounter() {
        return parseInt(localStorage.getItem(COUNTER_KEY)) || 256;
    }
    // Initialize counter display
    document.getElementById('counter-num').textContent = getCounter();

    // ── Start test ──
    window.startTest = function(mode) {
        currentMode = mode || 'normal';
        currentQuestion = 0;
        answers = [];
        currentSelections = [];
        currentResult = null;
        questions = buildQuestions(currentMode);
        document.getElementById('q-total').textContent = displayTotal;
        showScreen('question');
        renderQuestion();
    };

    // ── Render question ──
    function renderQuestion() {
        const q = questions[currentQuestion];
        isMultiSelect = !!q.multi;

        // Calculate display number (skip integrity questions in the count)
        let displayNum = 0;
        for (let i = 0; i <= currentQuestion; i++) {
            if (!questions[i]._isIntegrity) displayNum++;
        }
        document.getElementById('q-current').textContent = displayNum;
        document.getElementById('q-number').textContent = 'QUESTION ' + displayNum;
        document.getElementById('progress-fill').style.width =
            ((displayNum - 1) / displayTotal * 100) + '%';

        const qText = document.getElementById('q-text');
        qText.textContent = q.q;
        qText.classList.toggle('multi', isMultiSelect);

        // Show/hide multi hint
        let hint = document.getElementById('multi-hint');
        if (!hint) {
            hint = document.createElement('div');
            hint.id = 'multi-hint';
            hint.className = 'multi-hint';
            document.getElementById('q-text').parentNode.insertBefore(hint, document.getElementById('options-grid'));
        }
        hint.style.display = isMultiSelect ? 'block' : 'none';
        hint.textContent = '此题为多选题，请选择所有符合条件的选项';

        const letters = ['A', 'B', 'C', 'D'];
        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        currentSelections = [];
        document.getElementById('next-btn-wrap').style.display = 'none';

        q.opts.forEach((opt, i) => {
            const card = document.createElement('div');
            card.className = 'option-card';
            card.innerHTML = `
                <span class="option-letter">${letters[i]}</span>
                <span class="option-text">${opt}</span>
            `;
            card.addEventListener('click', () => selectOption(i, letters[i], card));
            grid.appendChild(card);
        });
    }

    function selectOption(index, letter, cardEl) {
        if (isMultiSelect) {
            // Toggle selection for multi-select
            const idx = currentSelections.findIndex(s => s.letter === letter);
            if (idx >= 0) {
                currentSelections.splice(idx, 1);
                cardEl.classList.remove('selected');
            } else {
                currentSelections.push({ index, letter });
                cardEl.classList.add('selected');
            }
            // Show next button only if at least 1 selected
            document.getElementById('next-btn-wrap').style.display =
                currentSelections.length > 0 ? 'flex' : 'none';
        } else {
            // Single select
            document.querySelectorAll('.option-card').forEach(c => c.classList.remove('selected'));
            cardEl.classList.add('selected');
            currentSelections = [{ index, letter }];
            document.getElementById('next-btn-wrap').style.display = 'flex';
        }
        // Update button text
        const btn = document.getElementById('btn-next');
        if (currentQuestion === questions.length - 1) {
            btn.innerHTML = '查看结果 <i class="fa-solid fa-sparkles"></i>';
        } else {
            btn.innerHTML = '下一题 <i class="fa-solid fa-arrow-right"></i>';
        }
    }

    window.nextQuestion = function() {
        if (currentSelections.length === 0) return;
        // Store answers: for multi-select, store all selected letters; for single, store the letter
        if (isMultiSelect) {
            answers.push(currentSelections.map(s => s.letter));
        } else {
            answers.push(currentSelections[0].letter);
        }

        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            renderQuestion();
            // Scroll to top of question card
            document.getElementById('screen-question').scrollIntoView({ behavior: 'smooth' });
        } else {
            // All answered — calculate result
            showResult();
            getAndIncrementCounter();
            document.getElementById('counter-num').textContent = getCounter();
        }
    };

    // ── Calculate & show result ──
    function showResult() {
        const counts = { A: 0, B: 0, C: 0, D: 0 };
        const totalQ = questions.length;

        // ── Integrity check ──
        // Find the two integrity questions and compare answers
        // The options map to the same meanings but with different letter positions:
        // Q1: A=可爱 B=帅气 C=安静 D=热闹
        // Q2: D=可爱 C=安静 B=帅气 A=热闹 → remap: Q2.A→D, Q2.B→C, Q2.C→B, Q2.D→A
        let integrityFailed = false;
        const integrityAnswers = [];
        questions.forEach((q, i) => {
            if (q._isIntegrity) {
                integrityAnswers.push({ index: i, answer: answers[i], qIndex: integrityAnswers.length });
            }
        });
        if (integrityAnswers.length === 2) {
            const a1 = integrityAnswers[0].answer; // first integrity question answer
            const a2 = integrityAnswers[1].answer; // second integrity question answer
            // Both should be strings (not arrays since they are single-select)
            const ans1 = Array.isArray(a1) ? a1[0] : a1;
            const ans2 = Array.isArray(a2) ? a2[0] : a2;
            // Remap Q2 answer to Q1's letter space
            const remap = { 'A': 'D', 'B': 'C', 'C': 'B', 'D': 'A' };
            const ans2remapped = remap[ans2] || ans2;
            if (ans1 !== ans2remapped) {
                integrityFailed = true;
            }
        }

        // If integrity check failed → force "整蛊小丑" result
        if (integrityFailed) {
            const profile = profiles.troll;
            const variant = profile.variants[0];
            currentResult = {
                typeKey: 'troll',
                type: profile.type,
                icon: profile.icon,
                color: profile.color,
                colorName: profile.colorName,
                name: variant.name,
                desc: variant.desc,
                catchphrase: variant.catchphrase,
                artstyle: variant.artstyle
            };
            // Show result with troll styling
            document.getElementById('result-icon').textContent = profile.icon;
            document.getElementById('result-name').textContent = variant.name;
            document.getElementById('result-name').style.color = profile.color;
            const tag = document.getElementById('result-tag');
            tag.textContent = profile.type + ' · ' + variant.desc;
            tag.style.background = profile.color;
            document.getElementById('result-catchphrase').textContent = variant.catchphrase;
            document.getElementById('result-artstyle').textContent = variant.artstyle;
            document.getElementById('result-color').textContent = profile.colorName;
            document.getElementById('result-color').style.color = profile.color;

            // Hide score breakdown for troll result, show warning instead
            const sb = document.getElementById('score-breakdown');
            sb.innerHTML = '<div style="text-align:center;color:#FF1744;font-weight:700;font-size:15px;width:100%;padding:8px;">检测到乱选行为！结果不可信</div>';

            showScreen('result');
            setTimeout(generateCanvasCard, 100);
            document.getElementById('screen-result').scrollIntoView({ behavior: 'smooth' });
            return;
        }

        // Normal scoring
        answers.forEach(a => {
            if (Array.isArray(a)) {
                // Multi-select: each selected letter gets a point (but weighted less to not over-influence)
                a.forEach(letter => { counts[letter] += 0.5; });
            } else {
                counts[a]++;
            }
        });

        // Determine dominant type
        const typeMap = { A: 'cute', B: 'cool', C: 'heal', D: 'chaos' };
        let maxCount = -1;
        let maxKey = 'cute';
        for (const [letter, key] of Object.entries(typeMap)) {
            if (counts[letter] > maxCount) {
                maxCount = counts[letter];
                maxKey = key;
            }
        }

        const profile = profiles[maxKey];
        const variant = profile.variants[Math.floor(Math.random() * profile.variants.length)];

        currentResult = {
            typeKey: maxKey,
            type: profile.type,
            icon: profile.icon,
            color: profile.color,
            colorName: profile.colorName,
            name: variant.name,
            desc: variant.desc,
            catchphrase: variant.catchphrase,
            artstyle: variant.artstyle
        };

        // Update DOM
        document.getElementById('result-icon').textContent = profile.icon;
        document.getElementById('result-name').textContent = variant.name;
        document.getElementById('result-name').style.color = profile.color;
        const tag = document.getElementById('result-tag');
        tag.textContent = profile.type + ' · ' + variant.desc;
        tag.style.background = profile.color;
        document.getElementById('result-catchphrase').textContent = variant.catchphrase;
        document.getElementById('result-artstyle').textContent = variant.artstyle;
        document.getElementById('result-color').textContent = profile.colorName;
        document.getElementById('result-color').style.color = profile.color;

        // Score breakdown
        const sb = document.getElementById('score-breakdown');
        const labels = { A: '可爱', B: '帅气', C: '治愈', D: '混沌' };
        const colors = { A: profiles.cute.color, B: profiles.cool.color, C: profiles.heal.color, D: profiles.chaos.color };
        sb.innerHTML = '';
        ['A','B','C','D'].forEach(letter => {
            const pct = Math.round(counts[letter] / totalQ * 100);
            const displayCount = Number.isInteger(counts[letter]) ? counts[letter] : counts[letter].toFixed(1);
            const div = document.createElement('div');
            div.className = 'score-item';
            div.innerHTML = `
                <div style="color:${colors[letter]};font-weight:700;">${labels[letter]}</div>
                <div style="font-size:18px;font-weight:700;">${displayCount}</div>
                <div class="score-bar"><div class="score-bar-fill" style="width:${pct}%;background:${colors[letter]};"></div></div>
            `;
            sb.appendChild(div);
        });

        showScreen('result');

        // Generate canvas card
        setTimeout(generateCanvasCard, 100);

        // Scroll to result
        document.getElementById('screen-result').scrollIntoView({ behavior: 'smooth' });
    }

    // ── Canvas card generation ──
    function generateCanvasCard() {
        const container = document.getElementById('canvas-container');
        container.innerHTML = '';

        const canvas = document.createElement('canvas');
        canvas.width = 400;
        canvas.height = 500;
        const ctx = canvas.getContext('2d');

        const r = currentResult;
        const c = hexToRgb(r.color);

        // Background gradient
        const grad = ctx.createLinearGradient(0, 0, 400, 500);
        grad.addColorStop(0, lightenColor(r.color, 0.4));
        grad.addColorStop(0.5, r.color);
        grad.addColorStop(1, darkenColor(r.color, 0.3));
        ctx.fillStyle = grad;
        roundRect(ctx, 0, 0, 400, 500, 16);
        ctx.fill();

        // White overlay card
        ctx.fillStyle = 'rgba(255,255,255,0.92)';
        roundRect(ctx, 20, 20, 360, 460, 12);
        ctx.fill();

        // Title
        ctx.fillStyle = '#666';
        ctx.font = 'bold 14px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('✦ 你的 VTuber 人格 ✦', 200, 60);

        // Icon
        ctx.font = '52px sans-serif';
        ctx.fillText(r.icon, 200, 115);

        // Name
        ctx.fillStyle = r.color;
        ctx.font = 'bold 28px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(r.name, 200, 160);

        // Type tag
        const tagText = r.type + ' · ' + r.desc;
        const tagW = ctx.measureText(tagText).width + 24;
        ctx.fillStyle = r.color;
        roundRect(ctx, 200 - tagW/2, 175, tagW, 26, 13);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '12px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(tagText, 200, 193);

        // Separator
        ctx.strokeStyle = r.color + '44';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(60, 215);
        ctx.lineTo(340, 215);
        ctx.stroke();

        // Details
        let y = 245;
        ctx.textAlign = 'left';

        // Catchphrase
        ctx.fillStyle = '#888';
        ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText('💬 口头禅', 60, y);
        y += 18;
        ctx.fillStyle = '#444';
        ctx.font = 'italic 15px "PingFang SC","Microsoft YaHei",sans-serif';
        wrapText(ctx, '『' + r.catchphrase + '』', 60, y, 280, 22);
        y += 42;

        // Art style
        ctx.fillStyle = '#888';
        ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText('🎨 立绘风格', 60, y);
        y += 18;
        ctx.fillStyle = '#444';
        ctx.font = '14px "PingFang SC","Microsoft YaHei",sans-serif';
        wrapText(ctx, r.artstyle, 60, y, 280, 20);
        y += 55;

        // Color
        ctx.fillStyle = '#888';
        ctx.font = '11px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText('🎨 代表色', 60, y);
        y += 18;
        ctx.fillStyle = r.color;
        ctx.font = 'bold 15px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.fillText(r.colorName, 60, y);
        // Color swatch
        ctx.fillStyle = r.color;
        roundRect(ctx, 200, y - 14, 20, 20, 4);
        ctx.fill();

        // Footer
        ctx.fillStyle = '#aaa';
        ctx.font = '10px "PingFang SC","Microsoft YaHei",sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('ciallo0721-cmd 工具出品 | 91vip.xn--32v.ink', 200, 465);

        container.appendChild(canvas);

        // Store canvas reference for download
        window._resultCanvas = canvas;
    }

    // ── Canvas utility functions ──
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function wrapText(ctx, text, x, y, maxW, lineH) {
        // Simple: split by CJK boundaries and measure
        let line = '';
        let currentY = y;
        for (let i = 0; i < text.length; i++) {
            const testLine = line + text[i];
            const metrics = ctx.measureText(testLine);
            if (metrics.width > maxW && line.length > 0) {
                ctx.fillText(line, x, currentY);
                line = text[i];
                currentY += lineH;
            } else {
                line = testLine;
            }
        }
        if (line.length > 0) {
            ctx.fillText(line, x, currentY);
        }
    }

    function hexToRgb(hex) {
        const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
        return result ? {
            r: parseInt(result[1], 16),
            g: parseInt(result[2], 16),
            b: parseInt(result[3], 16)
        } : { r: 0, g: 0, b: 0 };
    }

    function lightenColor(hex, amount) {
        const c = hexToRgb(hex);
        const r = Math.min(255, Math.round(c.r + (255 - c.r) * amount));
        const g = Math.min(255, Math.round(c.g + (255 - c.g) * amount));
        const b = Math.min(255, Math.round(c.b + (255 - c.b) * amount));
        return `rgb(${r},${g},${b})`;
    }

    function darkenColor(hex, amount) {
        const c = hexToRgb(hex);
        const r = Math.max(0, Math.round(c.r * (1 - amount)));
        const g = Math.max(0, Math.round(c.g * (1 - amount)));
        const b = Math.max(0, Math.round(c.b * (1 - amount)));
        return `rgb(${r},${g},${b})`;
    }

    // ── Share functions ──
    window.saveImage = function() {
        if (!window._resultCanvas) return;
        const link = document.createElement('a');
        link.download = 'vtuber-personality-' + currentResult.name + '.png';
        link.href = window._resultCanvas.toDataURL('image/png');
        link.click();
        showToast('卡片已保存！');
    };

    window.copyResult = function() {
        const r = currentResult;
        const text = `🎭 我的VTuber人格测试结果\n\n` +
            `✨ 名字：${r.name}\n` +
            `🏷 类型：${r.type} · ${r.desc}\n` +
            `💬 口头禅：${r.catchphrase}\n` +
            `🎨 立绘风格：${r.artstyle}\n` +
            `🌈 代表色：${r.colorName}\n\n` +
            `你也来测测👉 https://91vip.xn--32v.ink/tools/vtuber-personality-test/`;

        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('结果已复制到剪贴板！');
            }).catch(() => fallbackCopy(text));
        } else {
            fallbackCopy(text);
        }
    };

    function fallbackCopy(text) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        try {
            document.execCommand('copy');
            showToast('结果已复制到剪贴板！');
        } catch(e) {
            showToast('复制失败，请手动复制');
        }
        document.body.removeChild(ta);
    }

    window.shareQQ = function() {
        const r = currentResult;
        const url = encodeURIComponent('https://91vip.xn--32v.ink/tools/vtuber-personality-test/');
        const title = encodeURIComponent(`我的VTuber人格：${r.name}（${r.type}·${r.desc}）`);
        const summary = encodeURIComponent(`口头禅：${r.catchphrase} | 你也来测测你的VTuber人格吧！`);
        const shareUrl = `https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?url=${url}&title=${title}&summary=${summary}&site=ciallo0721-cmd`;
        window.open(shareUrl, '_blank', 'width=600,height=500');
    };

    window.retryTest = function() {
        currentMode = 'normal';
        currentQuestion = 0;
        questions = [];
        answers = [];
        currentSelections = [];
        currentResult = null;
        document.getElementById('canvas-container').innerHTML = '';
        showScreen('welcome');
        document.getElementById('counter-num').textContent = getCounter();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    // ── Toast ──
    let toastTimer;
    function showToast(msg) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }
})();
