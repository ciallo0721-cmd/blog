<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="12道趣味题目，测测你的VTuber人格是可爱系、帅气系、治愈系还是混沌系？生成精美卡片分享给好友！">
    <meta name="keywords" content="VTuber,人格测试,虚拟主播,二次元,心理测试">
    <link rel="canonical" href="https://91vip.xn--32v.ink/tools/vtuber-personality-test/">
    <link rel="icon" href="../../fanv.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>VTuber 人格测试 | ciallo0721-cmd</title>

    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "VTuber 人格测试",
        "description": "12道趣味题目测测你的VTuber人格",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "All",
        "author": {
            "@type": "Organization",
            "name": "ciallo0721-cmd"
        }
    }
    </script>

    <style>
@font-face {
    font-family: 'MaokenAssortedSans';
    src: url('../../css/MaokenAssortedSans.ttf') format('truetype');
    font-weight: normal;
    font-style: normal;
}

        :root {
            --bili-pink: #3366ff;
            --bili-blue: #2575fc;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-primary: #2c3e50;
            --text-secondary: #6b7b8d;
            --shadow: 0 4px 24px rgba(0,0,0,0.1);
            --shadow-hover: 0 8px 32px rgba(0,0,0,0.15);
            --radius: 16px;
            --cute: #FF6B9D;
            --cool: #2575FC;
            --heal: #4CAF50;
            --chaos: #FF6F00;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'MaokenAssortedSans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 640px;
            padding: 16px;
            flex: 1;
        }

        /* Header */
        .header {
            text-align: center;
            padding: 32px 16px 20px;
        }
        .header .logo-icon {
            font-size: 48px;
            margin-bottom: 8px;
            display: block;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--bili-pink), var(--bili-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow);
            margin-bottom: 16px;
        }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; animation: fadeInUp 0.5s ease; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Welcome Screen */
        .welcome-content { text-align: center; }
        .welcome-content .icon-row {
            font-size: 36px;
            margin: 12px 0;
            display: flex;
            justify-content: center;
            gap: 12px;
        }
        .welcome-content p {
            color: var(--text-secondary);
            margin: 12px 0 20px;
            font-size: 15px;
        }
        .counter-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e8f0fe, #dce8f5);
            border-radius: 20px;
            padding: 6px 16px;
            font-size: 13px;
            color: var(--bili-blue);
            margin-bottom: 16px;
        }
        .counter-badge i { margin-right: 4px; }

        /* Progress Bar */
        .progress-wrap {
            background: #e8edf2;
            border-radius: 10px;
            height: 8px;
            margin-bottom: 20px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--bili-pink), var(--bili-blue));
            border-radius: 10px;
            transition: width 0.4s ease;
            width: 0%;
        }
        .progress-label {
            font-size: 13px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 12px;
        }

        /* Question */
        .question-text {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
        }
        .question-number {
            font-size: 12px;
            color: var(--bili-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-align: center;
            margin-bottom: 4px;
        }
        .options-grid {
            display: grid;
            gap: 10px;
        }
        .option-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 2px solid #e8edf2;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #fafbfc;
        }
        .option-card:hover {
            border-color: var(--bili-blue);
            background: #f0f5ff;
            transform: translateX(4px);
        }
        .option-card:active {
            transform: scale(0.98);
        }
        .option-card.selected {
            border-color: var(--bili-blue);
            background: linear-gradient(135deg, #f0f5ff, #e8f0fe);
            box-shadow: 0 0 0 3px rgba(37,117,252,0.15);
        }
        .question-text.multi::before {
            content: '* ';
            color: #ff4757;
            font-weight: 900;
        }
        .multi-hint {
            text-align: center;
            font-size: 12px;
            color: #ff4757;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .option-letter {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--bili-pink), var(--bili-blue));
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
        }
        .option-text { flex: 1; font-size: 15px; }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 28px;
            border-radius: 24px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--bili-pink), var(--bili-blue));
            color: #fff;
            box-shadow: 0 4px 16px rgba(37,117,252,0.3);
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,117,252,0.4); }
        .btn-primary:active { transform: scale(0.97); }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .mode-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }
        .mode-card {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            border: 2px solid #e8edf2;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #fafbfc;
        }
        .mode-card:hover {
            border-color: var(--bili-blue);
            background: #f0f5ff;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(37,117,252,0.12);
        }
        .mode-card:active { transform: scale(0.98); }
        .mode-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            color: #fff;
        }
        .mode-icon.simple { background: linear-gradient(135deg, #43e97b, #38f9d7); }
        .mode-icon.normal { background: linear-gradient(135deg, var(--bili-pink), var(--bili-blue)); }
        .mode-icon.complex { background: linear-gradient(135deg, #f7971e, #ffd200); }
        .mode-info { flex: 1; text-align: left; }
        .mode-title { font-size: 15px; font-weight: 700; color: var(--text-primary); }
        .mode-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
        .mode-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--bili-pink), var(--bili-blue));
            color: #fff;
            flex-shrink: 0;
        }

        /* NSFW Toggle */
        .nsfw-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            border: 2px dashed #e0e0e0;
            border-radius: 14px;
            margin-bottom: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
            user-select: none;
        }
        .nsfw-toggle:hover { border-color: #ff6b6b; background: #fff5f5; }
        .nsfw-toggle.active { border-color: #ff4757; background: #fff0f0; border-style: solid; }
        .nsfw-switch {
            width: 44px;
            height: 24px;
            border-radius: 12px;
            background: #d0d0d0;
            position: relative;
            flex-shrink: 0;
            transition: background 0.25s ease;
        }
        .nsfw-toggle.active .nsfw-switch { background: #ff4757; }
        .nsfw-knob {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #fff;
            position: absolute;
            top: 2px;
            left: 2px;
            transition: left 0.25s ease;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        }
        .nsfw-toggle.active .nsfw-knob { left: 22px; }
        .nsfw-label { text-align: left; }
        .nsfw-title {
            display: block;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .nsfw-toggle.active .nsfw-title { color: #ff4757; }
        .nsfw-desc {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 1px;
        }

        .btn-center { display: flex; justify-content: center; margin-top: 20px; }

        /* Result Screen */
        .result-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .result-type-icon {
            font-size: 64px;
            display: block;
            animation: popIn 0.6s cubic-bezier(0.68,-0.55,0.265,1.55);
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        .result-name {
            font-size: 32px;
            font-weight: 800;
            margin: 8px 0;
        }
        .result-type-tag {
            display: inline-block;
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            margin: 4px;
        }
        .detail-item {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f2f5;
        }
        .detail-item:last-child { border-bottom: none; }
        .detail-icon {
            width: 28px;
            color: var(--bili-blue);
            font-size: 16px;
            text-align: center;
            flex-shrink: 0;
            padding-top: 2px;
        }
        .detail-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .detail-value {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .detail-value.catchphrase {
            font-style: italic;
            color: #555;
        }
        
        /* 参考vtuber 样式 */
        .ref-vtuber-item {
            margin-top: 4px;
            font-size: 14px;
            line-height: 1.5;
            color: #3c5a7d;
            background: #f8faff;
            border-radius: 12px;
            padding: 6px 12px;
            margin-bottom: 6px;
            display: inline-block;
            width: auto;
            border-left: 4px solid var(--bili-blue);
        }
        .ref-vtuber-wrapper {
            margin-top: 4px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }
        .ref-label {
            font-weight: 700;
            color: var(--text-primary);
            background: #eef2fa;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 12px;
        }

        /* Canvas Container */
        .canvas-container {
            text-align: center;
            margin: 16px 0;
        }
        .canvas-container canvas {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        /* Share Buttons */
        .share-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 16px;
        }
        .share-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .share-btn:hover { transform: translateY(-2px); }
        .share-btn:active { transform: scale(0.97); }
        .share-save { background: #2575FC; color: #fff; }
        .share-copy { background: #f0f5ff; color: #2575FC; border: 2px solid #2575FC; }
        .share-qq { background: #12B7F5; color: #fff; }
        .share-retry { background: #f5f5f5; color: #666; }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 10px 24px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        /* Score breakdown */
        .score-breakdown {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin: 12px 0;
            flex-wrap: wrap;
        }
        .score-item {
            text-align: center;
            padding: 8px 12px;
            border-radius: 10px;
            background: #f8f9fb;
            min-width: 50px;
        }
        .score-bar {
            width: 40px;
            height: 6px;
            border-radius: 3px;
            margin: 4px auto 0;
            overflow: hidden;
            background: #e8edf2;
        }
        .score-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease;
        }

        /* Footer / CTA */
        .cta-section {
            text-align: center;
            padding: 24px 16px 32px;
        }
        .cta-section a {
            display: inline-block;
            padding: 12px 32px;
            border-radius: 24px;
            background: linear-gradient(135deg, var(--bili-pink), var(--bili-blue));
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 16px rgba(37,117,252,0.3);
            transition: all 0.2s ease;
        }
        .cta-section a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(37,117,252,0.4);
        }
        .cta-section .cta-sub {
            color: var(--text-secondary);
            font-size: 12px;
            margin-top: 8px;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container { padding: 10px; }
            .header { padding: 20px 12px 12px; }
            .header h1 { font-size: 22px; }
            .card { padding: 16px; }
            .question-text { font-size: 16px; }
            .result-name { font-size: 24px; }
            .share-buttons { gap: 6px; }
            .share-btn { padding: 8px 14px; font-size: 13px; }
            .option-card { padding: 12px 14px; }
            .option-text { font-size: 14px; }
            .ref-vtuber-item { font-size: 12px; padding: 4px 10px; }
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Header -->
    <div class="header">
        <span class="logo-icon">🎭</span>
        <h1>VTuber 人格测试</h1>
        <p class="subtitle">12道题，发现你的虚拟主播灵魂</p>
    </div>

    <!-- Welcome Screen -->
    <div class="screen active" id="screen-welcome">
        <div class="card welcome-content">
            <div class="icon-row">
                <span>🐱‍💻</span><span>🎤</span><span>🎮</span><span>✨</span>
            </div>
            <p>每个主播都有独特的人格魅力<br>你的<strong>VTuber灵魂</strong>是什么样的？<br>选择难度开始测试吧！</p>
            <div class="counter-badge" id="counter-badge">
                <i class="fa-solid fa-users"></i> 已有 <strong id="counter-num">256</strong> 人完成测试
            </div>
            <!-- NSFW Toggle -->
            <div class="nsfw-toggle" onclick="toggleNSFW()">
                <div class="nsfw-switch">
                    <div class="nsfw-knob" id="nsfw-knob"></div>
                </div>
                <div class="nsfw-label">
                    <span class="nsfw-title">NSFW 模式</span>
                    <span class="nsfw-desc">开启后可能会问政治 / RSQ方面的内容</span>
                </div>
            </div>
            <div class="mode-grid">
                <div class="mode-card" onclick="startTest('simple')">
                    <div class="mode-icon simple"><i class="fa-solid fa-feather"></i></div>
                    <div class="mode-info">
                        <div class="mode-title">简单</div>
                        <div class="mode-desc">题少，但是可能不准</div>
                    </div>
                    <span class="mode-badge">6题</span>
                </div>
                <div class="mode-card" onclick="startTest('normal')">
                    <div class="mode-icon normal"><i class="fa-solid fa-star"></i></div>
                    <div class="mode-info">
                        <div class="mode-title">正常（推荐）</div>
                        <div class="mode-desc">多角度分析</div>
                    </div>
                    <span class="mode-badge">推荐</span>
                </div>
                <div class="mode-card" onclick="startTest('complex')">
                    <div class="mode-icon complex"><i class="fa-solid fa-fire"></i></div>
                    <div class="mode-info">
                        <div class="mode-title">复杂</div>
                        <div class="mode-desc">题多（90道）但是准确</div>
                    </div>
                    <span class="mode-badge">90题</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Question Screen -->
    <div class="screen" id="screen-question">
        <div class="card">
            <div class="progress-label">
                题目 <span id="q-current">1</span> / <span id="q-total">12</span>
            </div>
            <div class="progress-wrap">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
            <div class="question-number" id="q-number">QUESTION 1</div>
            <div class="question-text" id="q-text"></div>
            <div class="options-grid" id="options-grid"></div>
            <div class="btn-center" id="next-btn-wrap" style="display:none;">
                <button class="btn btn-primary" id="btn-next" onclick="nextQuestion()">
                    下一题 <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Result Screen -->
    <div class="screen" id="screen-result">
        <div class="card" id="result-card">
            <div class="result-header">
                <span class="result-type-icon" id="result-icon"></span>
                <div class="result-name" id="result-name"></div>
                <span class="result-type-tag" id="result-tag"></span>
            </div>
            <div class="score-breakdown" id="score-breakdown"></div>
            <div class="detail-item">
                <div class="detail-icon"><i class="fa-solid fa-quote-right"></i></div>
                <div>
                    <div class="detail-label">口头禅</div>
                    <div class="detail-value catchphrase" id="result-catchphrase"></div>
                </div>
            </div>
            <div class="detail-item">
                <div class="detail-icon"><i class="fa-solid fa-palette"></i></div>
                <div>
                    <div class="detail-label">立绘风格</div>
                    <div class="detail-value" id="result-artstyle"></div>
                </div>
            </div>
            <div class="detail-item">
                <div class="detail-icon"><i class="fa-solid fa-droplet"></i></div>
                <div>
                    <div class="detail-label">代表色</div>
                    <div class="detail-value" id="result-color"></div>
                </div>
            </div>
            <!-- 新增参考vtuber区域 -->
            <div class="detail-item" id="ref-vtuber-container" style="display: flex;">
                <div class="detail-icon"><i class="fa-solid fa-users-viewfinder"></i></div>
                <div style="flex:1">
                    <div class="detail-label">参考VTuber</div>
                    <div class="ref-vtuber-wrapper" id="ref-vtuber-list">
                        <!-- 动态填充占位符 方便修改 -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Canvas preview -->
        <div class="canvas-container" id="canvas-container"></div>

        <!-- Share buttons -->
        <div class="share-buttons">
            <button class="share-btn share-save" onclick="saveImage()">
                <i class="fa-solid fa-download"></i> 保存卡片
            </button>
            <button class="share-btn share-copy" onclick="copyResult()">
                <i class="fa-solid fa-copy"></i> 复制结果
            </button>
            <button class="share-btn share-qq" onclick="shareQQ()">
                <i class="fa-brands fa-qq"></i> QQ空间
            </button>
            <button class="share-btn share-retry" onclick="retryTest()">
                <i class="fa-solid fa-rotate-right"></i> 再测一次
            </button>
        </div>
    </div>

</div>

    window.shareQQ = function() { const r = currentResult; const url = encodeURIComponent('https://91vip.xn--32v.ink/tools/vtuber-personality-test/'); const title = encodeURIComponent(`我的VTuber人格：${r.name}（${r.type}·${r.desc}）`); const summary = encodeURIComponent(`口头禅：${r.catchphrase} | 你也来测测你的VTuber人格吧！`); window.open(`https://sns.qzone.qq.com/cgi-bin/qzshare/cgi_qzshare_onekey?url=${url}&title=${title}&summary=${summary}&site=ciallo0721-cmd`, '_blank'); };
    window.retryTest = function() { currentMode = 'normal'; currentQuestion = 0; questions = []; answers = []; currentSelections = []; currentResult = null; document.getElementById('canvas-container').innerHTML = ''; showScreen('welcome'); document.getElementById('counter-num').textContent = getCounter(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    let toastTimer; function showToast(msg) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2000); }
})();
</script>
