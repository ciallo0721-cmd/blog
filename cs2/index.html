<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CS2 风格 FPS - 爆破模式</title>
    <style>
        :root {
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            font-family: 'Courier New', monospace;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 18px;
            background: rgba(0, 0, 0, 0.75);
            border: 2px solid #555;
            border-radius: 8px;
            padding: 10px 18px;
            color: #fff;
            font-size: 13px;
            letter-spacing: 1px;
            pointer-events: auto;
            flex-wrap: wrap;
            justify-content: center;
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
            min-width: 50px;
        }
        .hud-label {
            font-size: 9px;
            color: #aaa;
            text-transform: uppercase;
        }
        .hud-value {
            font-size: 16px;
            font-weight: bold;
            color: #ffcc00;
        }
        .hud-value.health {
            color: #ff4444;
        }
        .hud-value.ammo {
            color: #88ccff;
        }
        .hud-value.nade {
            color: #ff8800;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 22px;
            height: 22px;
            pointer-events: none;
        }
        #crosshair::before,
        #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.6);
        }
        #crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
        }
        #crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
        }
        #buy-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 20, 20, 0.95);
            border: 2px solid #666;
            border-radius: 12px;
            padding: 20px;
            color: #fff;
            display: none;
            pointer-events: auto;
            min-width: 300px;
            text-align: center;
            z-index: 20;
        }
        #buy-menu h2 {
            margin-bottom: 12px;
            letter-spacing: 3px;
            color: #ffcc00;
            font-size: 18px;
        }
        .buy-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .buy-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 10px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .buy-item:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffcc00;
        }
        .buy-item.owned {
            border-color: #4f4;
            background: rgba(0, 255, 0, 0.1);
        }
        .buy-item.cant-afford {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .buy-item-name {
            font-weight: bold;
            font-size: 13px;
        }
        .buy-item-price {
            color: #ffcc00;
            font-size: 11px;
            margin-top: 3px;
        }
        #buy-close {
            margin-top: 10px;
            padding: 8px 20px;
            background: #555;
            border: none;
            border-radius: 6px;
            color: #fff;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 2px;
        }
        #mobile-controls {
            position: absolute;
            bottom: calc(30px + var(--safe-bottom));
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 20px;
            pointer-events: none;
            z-index: 15;
        }
        #joystick-zone {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            border: 3px solid rgba(255, 255, 255, 0.2);
            position: relative;
            pointer-events: auto;
            touch-action: none;
        }
        #joystick-thumb {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #fire-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(255, 40, 20, 0.55);
            border: 3px solid rgba(255, 90, 70, 0.7);
            color: #fff;
            font-size: 13px;
            font-weight: bold;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
        }
        #nade-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 140, 0, 0.5);
            border: 2px solid rgba(255, 180, 50, 0.6);
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        #mobile-buy-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #ffcc00;
            color: #ffcc00;
            font-size: 11px;
            font-weight: bold;
            pointer-events: auto;
            z-index: 16;
            display: none;
            touch-action: manipulation;
        }
        #game-over-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30;
            pointer-events: auto;
        }
        #game-over-overlay h1 {
            font-size: 42px;
            color: #fff;
            letter-spacing: 5px;
            margin-bottom: 8px;
        }
        #game-over-overlay .sub {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 25px;
        }
        #restart-btn {
            padding: 12px 35px;
            font-size: 16px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            letter-spacing: 3px;
            font-weight: bold;
            pointer-events: auto;
        }
        #hit-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 35px;
            height: 35px;
            border: 2px solid #ff0000;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }
        #countdown-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 28;
            pointer-events: auto;
        }
        #countdown-number {
            font-size: 100px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 0 0 40px rgba(255, 200, 0, 0.6);
        }
        #countdown-text {
            font-size: 18px;
            color: #fff;
            letter-spacing: 6px;
            margin-top: 8px;
        }
        #c4-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-size: 16px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 14px;
            border-radius: 6px;
            pointer-events: none;
            z-index: 12;
            display: none;
            letter-spacing: 2px;
        }
        @media (max-width: 768px) {
            #hud {
                font-size: 10px;
                gap: 8px;
                padding: 6px 10px;
            }
            .hud-value {
                font-size: 13px;
            }
            #crosshair {
                width: 16px;
                height: 16px;
            }
            #countdown-number {
                font-size: 70px;
            }
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div id="hud">
            <div class="hud-item"><span class="hud-label">血量</span><span class="hud-value health" id="hp-val">100</span></div>
            <div class="hud-item"><span class="hud-label">金钱</span><span class="hud-value" id="money-val">$1000</span></div>
            <div class="hud-item"><span class="hud-label">弹药</span><span class="hud-value ammo" id="ammo-val">∞</span></div>
            <div class="hud-item"><span class="hud-label">手雷</span><span class="hud-value nade" id="nade-val">0</span></div>
            <div class="hud-item"><span class="hud-label">击杀</span><span class="hud-value" id="kills-val">0/4</span></div>
            <div class="hud-item"><span class="hud-label">队友</span><span class="hud-value" id="teammate-hp">80</span></div>
        </div>
        <div id="crosshair"></div>
        <div id="hit-indicator"></div>
        <div id="c4-indicator">💣 C4安装点</div>
        <div id="buy-menu">
            <h2>🛒 购买菜单</h2>
            <div class="buy-grid">
                <div class="buy-item" data-weapon="pistol_upgrade"><span class="buy-item-name">🔫 升级手枪</span><span class="buy-item-price">$400</span></div>
                <div class="buy-item" data-weapon="rifle"><span class="buy-item-name">🎯 突击步枪</span><span class="buy-item-price">$2000</span></div>
                <div class="buy-item" data-weapon="smg"><span class="buy-item-name">🔧 冲锋枪</span><span class="buy-item-price">$1200</span></div>
                <div class="buy-item" data-weapon="nade"><span class="buy-item-name">💣 手榴弹x1</span><span class="buy-item-price">$300</span></div>
            </div>
            <button id="buy-close">关闭 [B]</button>
        </div>
        <div id="mobile-controls">
            <div id="joystick-zone"><div id="joystick-thumb"></div></div>
            <div style="display:flex;align-items:flex-end;gap:10px;">
                <div id="nade-btn">手雷</div>
                <div id="fire-btn">开火</div>
            </div>
        </div>
        <button id="mobile-buy-btn">B</button>
        <div id="countdown-overlay">
            <div id="countdown-number">5</div>
            <div id="countdown-text">准备阶段 - 自由移动</div>
        </div>
        <div id="game-over-overlay">
            <h1 id="go-title">游戏结束</h1>
            <p class="sub" id="go-sub"></p>
            <button id="restart-btn">重新开始</button>
        </div>
    </div>

    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // ==================== DOM ====================
        const buyMenu = document.getElementById('buy-menu');
        const buyCloseBtn = document.getElementById('buy-close');
        const mobileControls = document.getElementById('mobile-controls');
        const joystickZone = document.getElementById('joystick-zone');
        const joystickThumb = document.getElementById('joystick-thumb');
        const fireBtn = document.getElementById('fire-btn');
        const nadeBtn = document.getElementById('nade-btn');
        const mobileBuyBtn = document.getElementById('mobile-buy-btn');
        const gameOverOverlay = document.getElementById('game-over-overlay');
        const goTitle = document.getElementById('go-title');
        const goSub = document.getElementById('go-sub');
        const restartBtn = document.getElementById('restart-btn');
        const hitIndicator = document.getElementById('hit-indicator');
        const hpVal = document.getElementById('hp-val');
        const moneyVal = document.getElementById('money-val');
        const ammoVal = document.getElementById('ammo-val');
        const nadeVal = document.getElementById('nade-val');
        const killsVal = document.getElementById('kills-val');
        const teammateHpEl = document.getElementById('teammate-hp');
        const countdownOverlay = document.getElementById('countdown-overlay');
        const countdownNumber = document.getElementById('countdown-number');
        const countdownText = document.getElementById('countdown-text');
        const c4Indicator = document.getElementById('c4-indicator');

        // ==================== 状态 ====================
        const GAME_STATE = {
            playerHP: 100,
            money: 1000,
            ammo: Infinity,
            currentAmmoInMag: 30,
            maxMagAmmo: 30,
            grenades: 1,
            kills: 0,
            totalEnemies: 4,
            weapon: 'pistol',
            weaponDamage: { pistol: 25, pistol_upgrade: 38, rifle: 55, smg: 18 },
            weaponAmmo: { pistol: Infinity, pistol_upgrade: Infinity, rifle: 30, smg: 40 },
            weaponFireRate: { pistol: 0.4, pistol_upgrade: 0.35, rifle: 0.15, smg: 0.1 },
            gameOver: false,
            gameResult: null,
            isMobile: false,
            isPointerLocked: false,
            buyMenuOpen: false,
            teammateHP: 80,
            teammateAlive: true,
            enemiesKilledList: [],
            inputMode: 'auto',
            countdownActive: true,
            countdownValue: 5,
            gameStarted: false,
            c4Planted: false,
            c4Timer: 0,
            c4Position: null,
            roundTime: 180,
        };

        // ==================== Three.js ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 30, 70);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 100);
        // 玩家出生在T方基地（地图南侧）
        const T_SPAWN = { x: 0, z: 13 };
        const CT_SPAWN_AREAS = [
            { x: -10, z: -13 }, { x: 10, z: -13 }, { x: -6, z: -10 }, { x: 6, z: -10 }
        ];
        camera.position.set(T_SPAWN.x, 1.7, T_SPAWN.z);
        camera.lookAt(0, 1.7, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.insertBefore(renderer.domElement, document.getElementById('ui-layer'));
        renderer.domElement.style.cssText = 'position:absolute;top:0;left:0;z-index:5;';

        const ambientLight = new THREE.AmbientLight(0x404060, 0.7);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffeedd, 5);
        sunLight.position.set(20, 25, 10);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024;
        sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 80;
        sunLight.shadow.camera.left = -25;
        sunLight.shadow.camera.right = 25;
        sunLight.shadow.camera.top = 25;
        sunLight.shadow.camera.bottom = -25;
        scene.add(sunLight);
        const fillLight = new THREE.DirectionalLight(0x8899cc, 1.2);
        fillLight.position.set(-8, 10, -10);
        scene.add(fillLight);

        // ==================== 纹理 ====================
        function createCanvasTexture(w, h, fn) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            fn(c.getContext('2d'), w, h);
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.colorSpace = THREE.SRGBColorSpace;
            return t;
        }

        function createBumpTexture(w, h, fn) {
            const c = document.createElement('canvas');
            c.width = w;
            c.height = h;
            fn(c.getContext('2d'), w, h);
            const t = new THREE.CanvasTexture(c);
            t.wrapS = t.wrapT = THREE.RepeatWrapping;
            t.colorSpace = THREE.LinearSRGBColorSpace;
            return t;
        }

        const groundTex = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#4a4a4a';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 4000; i++) {
                ctx.fillStyle = `rgba(${170+Math.random()*50},${170+Math.random()*50},${170+Math.random()*50},0.12)`;
                ctx.fillRect(Math.random() * w, Math.random() * h, Math.random() * 4, Math.random() * 4);
            }
            ctx.fillStyle = 'rgba(60,60,60,0.5)';
            ctx.beginPath();
            ctx.arc(w / 2, h / 2, 110, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(100,100,100,0.4)';
            ctx.lineWidth = 4;
            ctx.stroke();
        });
        groundTex.repeat.set(6, 6);

        const wallTex = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#8a8a8a';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 3000; i++) {
                ctx.fillStyle =
                    `rgba(${160+Math.random()*40},${155+Math.random()*40},${150+Math.random()*40},0.2)`;
                ctx.fillRect(Math.random() * w, Math.random() * h, Math.random() * 5, Math.random() * 5);
            }
        });
        wallTex.repeat.set(3, 1);

        const wallBump = createBumpTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#808080';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#c0c0c0';
            ctx.beginPath();
            ctx.arc(w / 2, h / 2, 80, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#606060';
            ctx.beginPath();
            ctx.arc(w / 2, h / 2, 55, 0, Math.PI * 2);
            ctx.fill();
        });
        wallBump.repeat.set(3, 1);

        const crateTex = createCanvasTexture(256, 256, (ctx, w, h) => {
            ctx.fillStyle = '#7a5a20';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.fillRect(0, 0, w, 3);
            ctx.fillRect(0, h - 3, w, 3);
            ctx.fillRect(0, 0, 3, h);
            ctx.fillRect(w - 3, 0, 3, h);
            ctx.fillRect(w / 2 - 2, 0, 4, h);
            ctx.fillRect(0, h / 2 - 2, w, 4);
        });

        // ==================== 地图（加大版 30x30） ====================
        const MAP_SIZE = 30;
        const WALL_H = 6;
        const WALL_T = 0.5;
        const obstacles = [];
        const allCollidables = [];

        function createWall(x, z, w, d, h = WALL_H) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                const py = pos.getY(i);
                const px = pos.getX(i);
                const pz = pos.getZ(i);
                if (Math.abs(py) > h * 0.4) {
                    pos.setX(i, px + Math.sin(pz * 4) * 0.04);
                    pos.setZ(i, pz + Math.cos(px * 4) * 0.04);
                }
                pos.setY(i, py + Math.sin(px * 3) * Math.cos(pz * 3) * 0.05);
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ map: wallTex, bumpMap: wallBump, bumpScale: 0.12, roughness: 0.65,
                metalness: 0.1 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            const aabb = { minX: x - w / 2, maxX: x + w / 2, minZ: z - d / 2, maxZ: z + d / 2, minY: 0, maxY: h };
            obstacles.push({ mesh, aabb });
            allCollidables.push({ mesh, aabb, type: 'wall' });
            return mesh;
        }

        function createPillar(x, z, rw = 1.2, rd = 1.2, h = WALL_H) {
            const geo = new THREE.BoxGeometry(rw, h, rd);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                pos.setY(i, pos.getY(i) + Math.sin(pos.getX(i) * 5) * Math.cos(pos.getZ(i) * 5) * 0.04);
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ map: wallTex, bumpMap: wallBump, bumpScale: 0.1, roughness: 0.6,
                metalness: 0.15 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            const aabb = { minX: x - rw / 2, maxX: x + rw / 2, minZ: z - rd / 2, maxZ: z + rd / 2, minY: 0, maxY: h };
            obstacles.push({ mesh, aabb });
            allCollidables.push({ mesh, aabb, type: 'pillar' });
            return mesh;
        }

        function createCrate(x, z, sx = 1.8, sy = 1.8, sz = 1.8) {
            const geo = new THREE.BoxGeometry(sx, sy, sz);
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
                if (Math.abs(pos.getY(i)) > sy * 0.35) pos.setY(i, pos.getY(i) + (Math.abs(pos.getX(i)) + Math.abs(pos.getZ(
                    i))) * 0.03 * Math.sign(pos.getY(i)));
            }
            geo.computeVertexNormals();
            const mat = new THREE.MeshStandardMaterial({ map: crateTex, roughness: 0.8, metalness: 0.05 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, sy / 2, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);
            const aabb = { minX: x - sx / 2, maxX: x + sx / 2, minZ: z - sz / 2, maxZ: z + sz / 2, minY: 0, maxY: sy };
            obstacles.push({ mesh, aabb });
            allCollidables.push({ mesh, aabb, type: 'crate' });
            return mesh;
        }

        function createGround() {

        const waypoints = [];

        function isPosClear(x, z, r = 0.7) {
            for (const obs of obstacles) {
                const a = obs.aabb;
                const cx = Math.max(a.minX, Math.min(x, a.maxX));
                const cz = Math.max(a.minZ, Math.min(z, a.maxZ));
                if (Math.sqrt((x - cx) ** 2 + (z - cz) ** 2) < r) return false;
            }
            if (Math.abs(x) > MAP_SIZE / 2 - 1 || Math.abs(z) > MAP_SIZE / 2 - 1) return false;
            return true;
        }

        function lineBlocked(x1, z1, x2, z2) {
            const steps = 25;
            for (let i = 0; i <= steps; i++) {
                const t = i / steps;
                if (!isPosClear(x1 + (x2 - x1) * t, z1 + (z2 - z1) * t, 0.5)) return true;
            }
            return false;
        }

        for (let x = -MAP_SIZE / 2 + 2; x <= MAP_SIZE / 2 - 2; x += WP_SPACING) {
            for (let z = -MAP_SIZE / 2 + 2; z <= MAP_SIZE / 2 - 2; z += WP_SPACING) {
                if (isPosClear(x, z, 0.8)) waypoints.push({ id: waypoints.length, x, z, neighbors: [] });
            }
        }

        for (const wp of waypoints) {
            for (const other of waypoints) {
                if (wp === other || wp.neighbors.includes(other.id)) continue;
                const d = Math.sqrt((wp.x - other.x) ** 2 + (wp.z - other.z) ** 2);
                if (d < WP_SPACING * 1.7 && !lineBlocked(wp.x, wp.z, other.x, other.z)) {
                    wp.neighbors.push(other.id);
                    other.neighbors.push(wp.id);
                }
            }
        }

        function nearestWP(x, z) {
            let best = null,
                bd = Infinity;
            for (const wp of waypoints) { const d = Math.sqrt((wp.x - x) ** 2 + (wp.z - z) ** 2); if (d < bd && isPosClear(wp.x,
                    wp.z, 0.6)) { bd = d;
                    best = wp; } }
            return best;
        }

        function astar(s, e) {
            if (!s || !e) return null;
            const open = [s],
                from = new Map(),
                g = new Map(),
                f = new Map();
            waypoints.forEach(w => { g.set(w.id, Infinity);
                f.set(w.id, Infinity); });
            g.set(s.id, 0);
            f.set(s.id, Math.hypot(s.x - e.x, s.z - e.z));
            const closed = new Set();
            while (open.length) {
                open.sort((a, b) => f.get(a.id) - f.get(b.id));
                const cur = open.shift();
                if (cur.id === e.id) { const path = [cur]; let c = cur; while (from.has(c.id)) { c = from.get(c.id);
                        path.unshift(c); } return path; }
                closed.add(cur.id);
                for (const nid of cur.neighbors) {
                    if (closed.has(nid)) continue;
                    const nb = waypoints.find(w => w.id === nid);
                    if (!nb) continue;
                    const tg = g.get(cur.id) + Math.hypot(cur.x - nb.x, cur.z - nb.z);
                    if (tg < g.get(nb.id)) { from.set(nb.id, cur);
                        g.set(nb.id, tg);
                        f.set(nb.id, tg + Math.hypot(nb.x - e.x, nb.z - e.z)); if (!open.find(w => w.id === nb.id)) open.push(
                            nb); }
                }
            }
            return null;
        }

        function checkCollisionAt(x, z, r = PLAYER_R) {
            for (const obs of allCollidables) { const a = obs.aabb; if (a.minY > 3) continue; const cx = Math.max(a.minX, Math
                    .min(x, a.maxX)); const cz = Math.max(a.minZ, Math.min(z, a.maxZ)); if (Math.sqrt((x - cx) ** 2 + (z - cz) **
                    2) < r) return true; }
            if (Math.abs(x) > MAP_SIZE / 2 - r || Math.abs(z) > MAP_SIZE / 2 - r) return true;
            return false;
        }

        function checkEntityCollisionAt(x, z, r, excl = null) {
            for (const e of enemies) { if (excl === e) continue; if (Math.hypot(x - e.position.x, z - e.position.z) < r + 0.45)
                    return true; }
            if (teammate && teammate.alive && excl !== teammate) { if (Math.hypot(x - teammate.position.x, z - teammate
                    .position.z) < r + 0.4) return true; }
            if (excl !== 'player') { if (Math.hypot(x - playerPosition.x, z - playerPosition.z) < r + PLAYER_R) return true; }
            return false;
        }

        function raycastShoot(origin, dir, range = 60) {
            const rc = new THREE.Raycaster(origin, dir.normalize(), 0.05, range);
            const targets = [];
            for (const e of enemies) e.model.traverse(c => { if (c.isMesh && c.geometry.type.includes('Sphere')) targets
                    .push({ mesh: c, enemy: e }); });
            for (const o of obstacles) o.mesh.traverse(c => { if (c.isMesh) targets.push({ mesh: c, obstacle: o }); });
            if (teammate && teammate.alive) teammate.model.traverse(c => { if (c.isMesh && c.geometry.type.includes(
                    'Sphere')) targets.push({ mesh: c, teammate: true }); });
            const hits = rc.intersectObjects(targets.map(t => t.mesh), false);
            if (hits.length) { const h = hits[0]; const t = targets.find(t => t.mesh === h.object); return { point: h.point,
                    normal: h.face?.normal || new THREE.Vector3(0, 1, 0), target: t, dist: h.distance }; }
            return null;
        }

        function shoot() {
            if (GAME_STATE.gameOver || !GAME_STATE.gameStarted || GAME_STATE.countdownActive) return;
            if (GAME_STATE.weapon === 'rifle' || GAME_STATE.weapon === 'smg') {
                if (GAME_STATE.currentAmmoInMag <= 0) return;
                GAME_STATE.currentAmmoInMag--;

                    GAME_STATE.currentAmmoInMag = 0; }
                updateAmmoDisplay();
            }
            triggerMuzzleFlash();
            const origin = camera.position.clone();
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const result = raycastShoot(origin, dir, 60);
            weaponGroup.position.z += 0.05;
            setTimeout(() => weaponGroup.position.z -= 0.05, 40);
            if (result?.target) {
                if (result.target.enemy) {
                    const e = result.target.enemy;
                    e.hp--;
                    e.flashTimer = 0.15;
                    e.lastKnownPlayerPos = playerPosition.clone();
                    showHitIndicator(true);
                    if (e.hp <= 0) killEnemy(e);
                } else if (result.target.teammate && teammate?.alive) {
                    teammate.hp -= GAME_STATE.weaponDamage[GAME_STATE.weapon];
                    teammateHpEl.textContent = Math.max(0, Math.round(teammate.hp));

                        teammateHpEl.textContent = '倒地';
                        GAME_STATE.teammateAlive = false; }

            }
        }

        function throwGrenade() {
            if (GAME_STATE.gameOver || !GAME_STATE.gameStarted || GAME_STATE.countdownActive) return;
            if (GAME_STATE.grenades <= 0) return;
            GAME_STATE.grenades--;
            nadeVal.textContent = GAME_STATE.grenades;
            const origin = camera.position.clone();
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const nadePos = origin.clone().add(dir.clone().multiplyScalar(1.5));
            // 手雷爆炸效果
            const flashGeo = new THREE.SphereGeometry(3, 16, 16);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xff6600, transparent: true, opacity: 0.8 });
            const flash = new THREE.Mesh(flashGeo, flashMat);
            flash.position.copy(nadePos.clone().add(dir.clone().multiplyScalar(5)));
            scene.add(flash);
            setTimeout(() => {
                scene.remove(flash);
                flashGeo.dispose();
                flashMat.dispose();
                // 范围伤害
                const blastCenter = nadePos.clone().add(dir.clone().multiplyScalar(5));
                for (const e of enemies) {
                    if (e.state === 'DEAD') continue;
                    if (blastCenter.distanceTo(e.position) < 6) {
                        e.hp -= 2;
                        e.flashTimer = 0.2;
                        e.lastKnownPlayerPos = playerPosition.clone();
                        if (e.hp <= 0) killEnemy(e);
                    }
                }
                if (teammate?.alive && blastCenter.distanceTo(teammate.position) < 4) {
                    teammate.hp -= 30;
                    teammateHpEl.textContent = Math.max(0, Math.round(teammate.hp));
                    if (teammate.hp <= 0) { teammate.alive = false;
                        teammate.model.position.y = 0.1;
                        teammateHpEl.textContent = '倒地';
                        GAME_STATE.teammateAlive = false; }
                }
            }, 800);
        }

        // ==================== AI ====================
        function canSeePoint(origin, tp, range = 25) {
            const d = origin.distanceTo(tp);
            if (d > range) return false;
            const rc = new THREE.Raycaster(origin, tp.clone().sub(origin).normalize(), 0.1, d);
            const meshes = [];
            for (const o of obstacles) o.mesh.traverse(c => { if (c.isMesh) meshes.push(c); });
            return rc.intersectObjects(meshes, false).length === 0;
        }

        function updateEnemyAI(e, delta) {
            if (e.state === 'DEAD') return;
            if (e.flashTimer > 0) {
                e.flashTimer -= delta;
                e.model.traverse(c => { if (c.material?.color?.getHex() === 0xcc2222) { c.material.emissive = new THREE.Color(
                        0xff0000);
                        c.material.emissiveIntensity = 2; } });
                if (e.flashTimer <= 0) e.model.traverse(c => { if (c.material?.emissive) { c.material.emissive = new THREE
                            .Color(0);
                        c.material.emissiveIntensity = 0; } });
            }
            const dp = e.position.distanceTo(playerPosition);
            const see = canSeePoint(new THREE.Vector3(e.position.x, 1.5, e.position.z), new THREE.Vector3(playerPosition.x,
                1.5, playerPosition.z), e.sightRange);
            if (see && dp < e.sightRange) { e.state = 'CHASE';
                e.lastKnownPlayerPos = playerPosition.clone();
                e.path = null;
                e.pathIndex = 0; } else if (e.state === 'CHASE' && !see) { if (e.lastKnownPlayerPos && e.position.distanceTo(e
                    .lastKnownPlayerPos) < 2) { e.state = 'PATROL';
                    e.lastKnownPlayerPos = null;
                    e.path = null; } else if (e.lastKnownPlayerPos) e.state = 'SEARCH';
                else e.state = 'PATROL'; }
            if (e.state === 'PATROL') {
                if (!e.patrolTarget || e.position.distanceTo(e.patrolTarget) < 1.5) { e.patrolWPIndex = (e.patrolWPIndex + 1) %
                        e.patrolWPSequence.length; const wp = e.patrolWPSequence[e.patrolWPIndex]; if (wp) e.patrolTarget =
                        new THREE.Vector3(wp.x, 0, wp.z); }
                if (e.patrolTarget) moveToward(e, e.patrolTarget, delta, 2.5);
            } else if (e.state === 'CHASE') {
                if (see && dp < e.attackRange) { moveToward(e, playerPosition, delta, 3.5);
                    e.attackCooldown -= delta; if (e.attackCooldown <= 0 && dp < e.attackRange) { e.attackCooldown = e
                            .attackRate;
                        attackPlayer(e); } } else if (e.lastKnownPlayerPos) navigateTo(e, e.lastKnownPlayerPos, delta);
            } else if (e.state === 'SEARCH') { if (e.lastKnownPlayerPos) { if (navigateTo(e, e.lastKnownPlayerPos, delta)) { e
                        .state = 'PATROL';
                        e.lastKnownPlayerPos = null;
                        e.path = null; } } }
            if (e.velocity.length() < 0.1 && (e.state === 'CHASE' || e.state === 'SEARCH')) { e.stuckTimer += delta; if (e
                    .stuckTimer > 1.5) { e.stuckTimer = 0;
                    e.path = null; } } else e.stuckTimer = 0;
            e.model.position.copy(e.position);
            if (e.state !== 'DEAD') { const lt = e.state === 'CHASE' ? playerPosition : e.lastKnownPlayerPos || e
                    .patrolTarget; if (lt) e.model.lookAt(lt.x, e.model.position.y, lt.z); }
        }

        function moveToward(e, t, delta, spd) {
            const d = new THREE.Vector3(t.x, 0, t.z).sub(new THREE.Vector3(e.position.x, 0, e.position.z)).normalize();
            const mx = d.x * spd * delta,
                mz = d.z * spd * delta;
            const nx = e.position.x + mx,
                nz = e.position.z + mz;
            if (!checkCollisionAt(nx, e.position.z, 0.45) && !checkEntityCollisionAt(nx, e.position.z, 0.45, e)) e.position.x =
                nx;
            if (!checkCollisionAt(e.position.x, nz, 0.45) && !checkEntityCollisionAt(e.position.x, nz, 0.45, e)) e.position.z =
                nz;
            e.velocity.set(d.x * spd, 0, d.z * spd);
        }

        function navigateTo(e, tp, delta) {
            if (!e.path || !e.path.length || e.pathIndex >= e.path.length) {
                const sw = nearestWP(e.position.x, e.position.z),
                    ew = nearestWP(tp.x, tp.z);
                if (sw && ew && sw.id !== ew.id) { e.path = astar(sw, ew);
                    e.pathIndex = 0; } else if (sw && ew && sw.id === ew.id) { moveToward(e, tp, delta, 3); return e.position
                        .distanceTo(tp) < 1.5; } else { moveToward(e, tp, delta, 2.5); return e.position.distanceTo(tp) <
                        1.5; }
            }
            if (e.path && e.pathIndex < e.path.length) { const wp = e.path[e.pathIndex]; moveToward(e, new THREE.Vector3(wp.x,
                    0, wp.z), delta, 3.5); if (e.position.distanceTo(new THREE.Vector3(wp.x, 0, wp.z)) < 1) e.pathIndex++; if (e
                    .pathIndex >= e.path.length) return true; }
            return false;
        }

        function attackPlayer(e) {
            GAME_STATE.playerHP -= e.damage;
            GAME_STATE.playerHP = Math.max(0, GAME_STATE.playerHP);

            document.body.appendChild(fl);

            if (GAME_STATE.playerHP <= 0) endGame(false);
        }

        function updateTeammateAI(delta) {
            if (!teammate?.alive || GAME_STATE.gameOver) return;
            const bp = playerPosition.clone();
            const bd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            bp.x -= bd.x * 3;
            bp.z -= bd.z * 3;
            bp.y = 0;
            if (!checkCollisionAt(bp.x, bp.z, 0.45) && !checkEntityCollisionAt(bp.x, bp.z, 0.45, teammate)) teammate
                .targetPosition.copy(bp);
            else { teammate.targetPosition.copy(playerPosition);
                teammate.targetPosition.y = 0; }
            const tt = teammate.targetPosition.clone().sub(teammate.position);
            const d = tt.length();
            if (d > 0.3) { tt.normalize(); const spd = Math.min(5, d * 3); const mx = tt.x * spd * delta,
                    mz = tt.z * spd * delta; const nx = teammate.position.x + mx,
                    nz = teammate.position.z + mz; if (!checkCollisionAt(nx, teammate.position.z, 0.45) && !
                    checkEntityCollisionAt(nx, teammate.position.z, 0.45, teammate)) teammate.position.x = nx; if (!
                    checkCollisionAt(teammate.position.x, nz, 0.45) && !checkEntityCollisionAt(teammate.position.x, nz,
                        0.45, teammate)) teammate.position.z = nz; }
            teammate.position.y = 0;
            teammate.model.position.copy(teammate.position);
            teammate.model.lookAt(playerPosition.x, teammate.model.position.y, playerPosition.z);
            teammate.attackCooldown -= delta;
            if (teammate.attackCooldown <= 0) {
                for (const e of enemies) { if (e.state === 'DEAD') continue; const ep = new THREE.Vector3(e.position.x, 1.5, e
                        .position.z),
                        tp = new THREE.Vector3(teammate.position.x, 1.5, teammate.position.z); if (tp.distanceTo(ep) <
                        teammate.sightRange && canSeePoint(tp, ep, teammate.sightRange)) { teammate.attackCooldown = teammate
                            .attackRate;
                        e.hp--;
                        e.flashTimer = 0.12;
                        e.lastKnownPlayerPos = playerPosition.clone(); if (e.hp <= 0) killEnemy(e); break; } }
            }
            teammateHpEl.textContent = Math.round(teammate.hp);
        }

        // 触屏

                0];

        // C4系统
        function plantC4() {

        function updateC4(delta) {
            if (!GAME_STATE.c4Planted || GAME_STATE.gameOver) return;
            GAME_STATE.c4Timer -= delta;
            c4Indicator.textContent = '💣 C4: ' + Math.ceil(GAME_STATE.c4Timer) + 's';
            if (GAME_STATE.c4Timer <= 0) {
                endGame(false);

        // ==================== 游戏循环 ====================
        const clock = new THREE.Clock();
        let shootCooldown = 0;
        const FIRE_RATE = () => GAME_STATE.weaponFireRate[GAME_STATE.weapon] || 0.4;

        function update(delta) {
            if (GAME_STATE.gameOver) return;
            delta = Math.min(delta, 0.12);

            updateC4(delta);

            if (GAME_STATE.countdownActive) {
                updateCountdown(delta);
                // 准备阶段可以自由移动和旋转视角
                if (GAME_STATE.inputMode === 'keyboard' && GAME_STATE.isPointerLocked) {
                    yaw -= accMouseDX * SENSITIVITY;
                    pitch -= accMouseDY * SENSITIVITY;
                    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                    accMouseDX = 0;
                    accMouseDY = 0;
                }
                const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
                camera.quaternion.setFromEuler(euler);
                // 准备阶段可以移动
                const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                fwd.y = 0;
                fwd.normalize();
                const rgt = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
                rgt.y = 0;
                rgt.normalize();
                let mx = 0,
                    mz = 0;
                if (GAME_STATE.inputMode === 'keyboard') { if (keys['w']) { mx += fwd.x;
                        mz += fwd.z; } if (keys['s']) { mx -= fwd.x;
                        mz -= fwd.z; } if (keys['a']) { mx -= rgt.x;
                        mz -= rgt.z; } if (keys['d']) { mx += rgt.x;
                        mz += rgt.z; } }
                if (GAME_STATE.inputMode === 'touch' && joystickActive) { const mr = 45; const d = Math.hypot(joystickDX,
                        joystickDY); const cd = Math.min(d, mr) / mr; const a = Math.atan2(joystickDY, joystickDX);
                    mx += rgt.x * Math.cos(a) * cd + fwd.x * (-Math.sin(a) * cd);
                    mz += rgt.z * Math.cos(a) * cd + fwd.z * (-Math.sin(a) * cd); }
                const ml = Math.hypot(mx, mz);
                if (ml > 1) { mx /= ml;
                    mz /= ml; }
                const spd = MOVE_SPEED * delta;
                const npx = playerPosition.x + mx * spd;
                const npz = playerPosition.z + mz * spd; if (!checkCollisionAt(npx, playerPosition.z, PLAYER_R))
                    playerPosition.x = npx; if (!checkCollisionAt(playerPosition.x, npz, PLAYER_R)) playerPosition.z =
                    npz;
                playerPosition.y = 1.7;
                camera.position.copy(playerPosition);
                // 敌人也自由移动
                for (const e of enemies) updateEnemyAI(e, delta);

                return;
            }

            if (GAME_STATE.buyMenuOpen) return;

            if (GAME_STATE.inputMode === 'keyboard' && GAME_STATE.isPointerLocked) {
                yaw -= accMouseDX * SENSITIVITY;
                pitch -= accMouseDY * SENSITIVITY;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
                accMouseDX = 0;
                accMouseDY = 0;
            }

            const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);

            const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            fwd.y = 0;
            fwd.normalize();
            const rgt = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            rgt.y = 0;
            rgt.normalize();
            let mx = 0,
                mz = 0;
            if (GAME_STATE.inputMode === 'keyboard') { if (keys['w']) { mx += fwd.x;
                    mz += fwd.z; } if (keys['s']) { mx -= fwd.x;
                    mz -= fwd.z; } if (keys['a']) { mx -= rgt.x;
                    mz -= rgt.z; } if (keys['d']) { mx += rgt.x;
                    mz += rgt.z; } }
            if (GAME_STATE.inputMode === 'touch' && joystickActive) { const mr = 45; const d = Math.hypot(joystickDX,
                    joystickDY); const cd = Math.min(d, mr) / mr; const a = Math.atan2(joystickDY, joystickDX);
                mx += rgt.x * Math.cos(a) * cd + fwd.x * (-Math.sin(a) * cd);
                mz += rgt.z * Math.cos(a) * cd + fwd.z * (-Math.sin(a) * cd); }
            const ml = Math.hypot(mx, mz);
            if (ml > 1) { mx /= ml;
                mz /= ml; }
            const spd = MOVE_SPEED * delta;
            const npx = playerPosition.x + mx * spd;
            const npz = playerPosition.z + mz * spd; if (!checkCollisionAt(npx, playerPosition.z, PLAYER_R)) playerPosition
                .x = npx; if (!checkCollisionAt(playerPosition.x, npz, PLAYER_R)) playerPosition.z = npz;
            playerPosition.y = 1.7;
            camera.position.copy(playerPosition);

            for (const e of enemies) updateEnemyAI(e, delta);
            updateTeammateAI(delta);

            if (fireBtnPressed && GAME_STATE.inputMode === 'touch' && GAME_STATE.gameStarted) {
                shootCooldown -= delta;
                if (shootCooldown <= 0) { shootCooldown = FIRE_RATE();
                    shoot(); }
            }

            // 接近C4安装点提示
            if (!GAME_STATE.c4Planted && GAME_STATE.gameStarted) {
                const dp = Math.hypot(playerPosition.x - C4_SITE.x, playerPosition.z - C4_SITE.z);
                if (dp < 3 && !c4Indicator.style.display) {
                    c4Indicator.style.display = 'block';
                    c4Indicator.textContent = '按E安装C4';
                } else if (dp >= 3 && c4Indicator.textContent.includes('安装C4')) {
                    c4Indicator.style.display = 'none';
                }
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            update(clock.getDelta());
            renderer.render(scene, camera);
        }

        // ==================== 启动 ====================
        resetAll();
        updateWeaponModel();
        hpVal.textContent = '100';
        moneyVal.textContent = '$1000';
        nadeVal.textContent = '1';
        killsVal.textContent = '0/' + GAME_STATE.totalEnemies;
        teammateHpEl.textContent = '80';
        ammoVal.textContent = '∞';
        startCountdown();
        animate();

        console.log('🎮 CS2风格FPS - 爆破模式');
        console.log('  地图: 30x30 仓库 | T方出生在南侧 | CT方在北侧');
        console.log('  武器: 手枪/升级手枪/冲锋枪/步枪/手榴弹');
        console.log('  5秒准备时间 - 可自由移动');
        console.log('  接近A点(C4图标)按E安装C4');
        console.log('  按G投掷手榴弹 | B打开购买菜单');
    </script>
