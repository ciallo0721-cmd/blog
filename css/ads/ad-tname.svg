<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90" width="728" height="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <!-- 主体紫蓝渐变 -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5b6cf0"/>
      <stop offset="50%" stop-color="#7c5cf0"/>
      <stop offset="100%" stop-color="#a05cf0"/>
    </linearGradient>
    <!-- 装饰圆 -->
    <radialGradient id="glow1" cx="50%" cy="50%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <!-- CTA 按钮渐变 -->
    <linearGradient id="ctaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <!-- 按钮阴影 -->
    <filter id="btnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- 地球 -->
    <radialGradient id="earth" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#1E5FB4"/>
    </radialGradient>
    <!-- 网格图案 -->
    <pattern id="gridPat" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 主背景 -->
  <rect width="728" height="90" fill="url(#bgMain)"/>
  <rect width="728" height="90" fill="url(#gridPat)"/>

  <!-- 背景装饰光晕 -->
  <circle cx="100" cy="45" r="120" fill="url(#glow1)"/>
  <circle cx="600" cy="-30" r="100" fill="url(#glow1)" opacity="0.6"/>
  <circle cx="700" cy="100" r="80" fill="url(#glow1)" opacity="0.5"/>

  <!-- 漂浮的域名小卡片装饰 -->
  <g opacity="0.08" transform="translate(280,15) rotate(-8)">
    <rect width="80" height="14" rx="2" fill="white"/>
  </g>
  <g opacity="0.06" transform="translate(320,65) rotate(5)">
    <rect width="60" height="12" rx="2" fill="white"/>
  </g>

  <!-- ====== 左侧地球插画 ====== -->
  <g transform="translate(50,45)">
    <!-- 外圈光晕 -->
    <circle cx="0" cy="0" r="34" fill="rgba(255,255,255,0.15)"/>
    <!-- 地球主体 -->
    <circle cx="0" cy="0" r="28" fill="url(#earth)"/>
    <!-- 简化大陆（白色） -->
    <path d="M-18,-8 Q-12,-15 -5,-12 Q0,-10 -2,-5 Q-8,-3 -15,-5 Q-20,-3 -18,-8 Z" fill="rgba(255,255,255,0.7)"/>
    <path d="M2,2 Q8,-2 14,3 Q18,8 12,12 Q6,15 2,10 Q-2,7 2,2 Z" fill="rgba(255,255,255,0.6)"/>
    <path d="M-5,12 Q0,10 4,15 Q2,20 -3,18 Q-8,16 -5,12 Z" fill="rgba(255,255,255,0.5)"/>
    <!-- 经线 -->
    <ellipse cx="0" cy="0" rx="28" ry="10" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="0.8"/>
    <!-- 高光 -->
    <ellipse cx="-8" cy="-10" rx="10" ry="6" fill="rgba(255,255,255,0.4)"/>
  </g>

  <!-- ====== 中间文案 ====== -->
  <!-- 顶部小标签 -->
  <g transform="translate(105,22)">
    <rect x="0" y="0" width="48" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
    <text x="24" y="11" font-size="9" font-weight="600" fill="white" text-anchor="middle" letter-spacing="0.5">域名注册</text>
  </g>

  <!-- 主标题 -->
  <text x="160" y="33" font-size="20" font-weight="800" fill="white" letter-spacing="0.5">
    <tspan fill="white">tname</tspan>
    <tspan fill="rgba(255,255,255,0.75)" font-weight="500" font-size="16">· 你的专属域名</tspan>
  </text>

  <!-- 副标题（价值主张） -->
  <text x="105" y="56" font-size="12" font-weight="600" fill="#FFD700">低至 6 折 · 限时优惠</text>
  <text x="148" y="56" font-size="11" font-weight="400" fill="rgba(255,255,255,0.85)">.top / .xyz / .icu 全新上线</text>

  <!-- 稀缺感 -->
  <text x="105" y="74" font-size="9" fill="rgba(255,255,255,0.6)">★ 已有 10万+ 用户 · 本月仅剩 200 个优惠名额</text>

  <!-- ====== 右侧 CTA 按钮 ====== -->
  <g transform="translate(572,30)" filter="url(#btnShadow)">
    <rect x="0" y="0" width="124" height="32" rx="16" fill="url(#ctaGrad)"/>
    <text x="62" y="20" font-size="13" font-weight="800" fill="#5b3a00" text-anchor="middle" letter-spacing="0.5">立即注册 →</text>
  </g>

  <!-- 顶部 AD 标签 -->
  <text x="708" y="14" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="end" letter-spacing="1">AD</text>
</svg>