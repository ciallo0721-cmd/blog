<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 728 90" width="728" height="90" font-family="'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <!-- 背景：近黑微紫 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0c11"/>
      <stop offset="55%" stop-color="#131018"/>
      <stop offset="100%" stop-color="#1a1115"/>
    </linearGradient>
    <!-- 玫瑰红光晕 -->
    <radialGradient id="glowRose" cx="35%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(196,30,58,0.16)"/>
      <stop offset="100%" stop-color="rgba(196,30,58,0)"/>
    </radialGradient>
    <!-- 顶部/底部暗红细线 -->
    <linearGradient id="lineRose" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(196,30,58,0)"/>
      <stop offset="50%" stop-color="#c41e3a"/>
      <stop offset="100%" stop-color="rgba(196,30,58,0)"/>
    </linearGradient>
    <!-- 品牌金字 -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8d5a0"/>
      <stop offset="100%" stop-color="#b08d3e"/>
    </linearGradient>
    <!-- CTA 竖排字 -->
    <linearGradient id="ctaRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e8405c"/>
      <stop offset="100%" stop-color="#a10f0f"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="728" height="90" fill="url(#bgGrad)"/>
  <rect width="728" height="90" fill="url(#glowRose)"/>
  <!-- 上下暗红细线 -->
  <rect x="0" y="0" width="728" height="1.5" fill="url(#lineRose)" opacity="0.8"/>
  <rect x="0" y="88.5" width="728" height="1.5" fill="url(#lineRose)" opacity="0.8"/>
  <!-- 极简内框 -->
  <rect x="6" y="6" width="716" height="78" fill="none" stroke="rgba(176,141,62,0.22)" stroke-width="0.75" rx="2"/>
  <!-- 左侧竖饰线 -->
  <line x1="40" y1="24" x2="40" y2="66" stroke="#c41e3a" stroke-width="1.2" opacity="0.55"/>

  <!-- ====== 品牌区（左） ====== -->
  <!-- 花朵 · 伪善Club · 花朵 -->
  <text x="66"  y="52" font-size="15" fill="#c41e3a" opacity="0.9">❀</text>
  <text x="228" y="57" font-size="30" font-weight="700" fill="url(#goldText)" text-anchor="middle" letter-spacing="2" font-family="'Noto Serif SC','SimSun',serif">伪善Club</text>
  <text x="322" y="52" font-size="15" fill="#c41e3a" opacity="0.9">❀</text>

  <!-- 副标 -->
  <text x="145" y="74" font-size="9.5" fill="#8a7d68" text-anchor="middle" letter-spacing="3">SUPERNATURAL · 超自然行动组</text>

  <!-- 品牌与 CTA 分隔的细竖线 -->
  <line x1="536" y1="22" x2="536" y2="68" stroke="rgba(196,30,58,0.35)" stroke-width="1"/>

  <!-- ====== CTA 区（右，竖排三行） ====== -->
  <g>
    <!-- 点击 -->
    <text x="618" y="28" font-size="13" font-weight="700" fill="url(#ctaRed)" text-anchor="middle" letter-spacing="1">点击</text>
    <!-- 了解 -->
    <text x="618" y="48" font-size="13" font-weight="700" fill="url(#ctaRed)" text-anchor="middle" letter-spacing="1">了解</text>
    <!-- 详情 -->
    <text x="618" y="68" font-size="13" font-weight="700" fill="url(#ctaRed)" text-anchor="middle" letter-spacing="1">详情</text>
    <!-- 右侧箭头 -->
    <path d="M688 26 h6 l-5 -6 M688 26 h6 l-5 6" stroke="#c41e3a" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M688 46 h6 l-5 -6 M688 46 h6 l-5 6" stroke="#c41e3a" stroke-width="1.4" fill="none" opacity="0.85"/>
    <path d="M688 66 h6 l-5 -6 M688 66 h6 l-5 6" stroke="#c41e3a" stroke-width="1.4" fill="none" opacity="0.85"/>
  </g>

  <!-- 右上 AD 标签 -->
  <text x="706" y="15" font-size="8" fill="rgba(138,125,104,0.75)" text-anchor="end" letter-spacing="2">AD</text>
</svg>
