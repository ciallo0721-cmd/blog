    <script>
document.addEventListener('DOMContentLoaded', function() {
    // 当前文章ID
    const currentArticleId = 15;

    function updateArticleInfo(articleId) {
        if (typeof window.articlesData === 'undefined') { setTimeout(() => updateArticleInfo(articleId), 100); return; }
        const articleData = window.articlesData.getArticleById(articleId);
        if (!articleData) return;
        document.getElementById('articleNumber').textContent = `文章 #${String(articleData.id).padStart(3, '0')}`;
        document.getElementById('articleTitle').textContent = articleData.title;
        document.getElementById('articleIntro').textContent = articleData.excerpt;
        document.getElementById('articleDate').textContent = articleData.date;
        document.getElementById('readTime').textContent = `约${articleData.readTime}分钟`;
        const tagsContainer = document.getElementById('articleTags');
        tagsContainer.innerHTML = '';
        if (articleData.tags) {
            articleData.tags.forEach(tag => {
                const tagElement = document.createElement('span');
                tagElement.className = 'article-tag';
                tagElement.textContent = tag;
                tagsContainer.appendChild(tagElement);
            });
        }
    }

    function initArticleNavigation(articleId) {
        const navigation = document.getElementById('articleNavigation');
        if (!navigation || typeof window.articlesData === 'undefined') return;
        const adjacent = window.articlesData.getAdjacentArticles(articleId);
        let navigationHTML = '';
        if (adjacent.prev) {
            navigationHTML += `<a href="/blog/${adjacent.prev.fileName}" class="nav-btn prev"><i class="fas fa-chevron-left"></i><div><div style="font-size:0.8rem;opacity:0.8;">上一篇</div><div>${adjacent.prev.title}</div></div></a>`;
        } else {
            navigationHTML += `<a href="javascript:void(0)" class="nav-btn prev disabled"><i class="fas fa-chevron-left"></i><div><div style="font-size:0.8rem;opacity:0.8;">上一篇</div><div>已是第一篇</div></div></a>`;
        }
        if (adjacent.next) {
            navigationHTML += `<a href="/blog/${adjacent.next.fileName}" class="nav-btn next"><div><div style="font-size:0.8rem;opacity:0.8;">下一篇</div><div>${adjacent.next.title}</div></div><i class="fas fa-chevron-right"></i></a>`;
        } else {
            navigationHTML += `<a href="javascript:void(0)" class="nav-btn next disabled"><div><div style="font-size:0.8rem;opacity:0.8;">下一篇</div><div>已是最后一篇</div></div><i class="fas fa-chevron-right"></i></a>`;
        }
        navigation.innerHTML = navigationHTML;
    }

    function initRelatedArticles(articleId) {
        const grid = document.getElementById('relatedGrid');
        if (!grid || typeof window.articlesData === 'undefined') return;
        const relatedArticles = window.articlesData.getFeaturedArticles(articleId, 3);
        grid.innerHTML = '';
        if (relatedArticles && relatedArticles.length > 0) {
            relatedArticles.forEach(article => {
                const card = document.createElement('a');
                card.href = '/blog/' + article.fileName;
                card.className = 'related-card';
                card.innerHTML = `<h4>${article.title}</h4><p>${article.excerpt}</p><div class="related-tags">${article.tags.slice(0, 3).map(tag => `<span class="related-tag">${tag}</span>`).join('')}</div>`;
                grid.appendChild(card);
            });
        }
    }

    function initPage() {
        if (typeof window.articlesData === 'undefined') { setTimeout(initPage, 100); return; }
        updateArticleInfo(currentArticleId);
        initArticleNavigation(currentArticleId);
        initRelatedArticles(currentArticleId);
    }
