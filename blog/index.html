    <script>
        (function() {
            function checkHTTP() {
                if (window.location.protocol === 'http:') {
                    var urlSpan = document.getElementById('currentHttpUrl');
                    if (urlSpan) urlSpan.textContent = window.location.href;
                    var overlay = document.getElementById('httpWarningOverlay');
                    if (overlay) overlay.style.display = 'flex';
                }
            }
            function switchToHTTPS() {
                var url = window.location.href;
                url = url.replace(/^http:/i, 'https:');
                window.location.href = url;
            }
            function continueHTTP() {
                var overlay = document.getElementById('httpWarningOverlay');
                if (overlay) overlay.style.display = 'none';
            }
            window.switchToHTTPS = switchToHTTPS;
            window.continueHTTP = continueHTTP;
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', checkHTTP);
            } else {
                checkHTTP();
            }
        })();
    </script>

    <header>
        <div class="container header-content">
            <h1>文章站</h1>

    <main class="container articles-main-container">
        <div class="articles-filters">
            <div class="search-container">
                <input type="text" id="searchInput" class="search-input" placeholder="搜索文章标题、标签或内容...">

            </div>

                <span id="tagsToggleText">展开全部标签 ▾</span>
            </button>

            <h2>所有文章</h2>
            <p class="articles-count">共 <span class="highlight" id="articleCount">0</span> 篇文章</p>
        </div>

    <script>
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.articlesData || typeof window.articlesData.getSortedArticles !== 'function') {
                console.warn('articlesData 未正确加载');
                window.articlesData = { getSortedArticles: function() { return []; } };
            }
            var allArticles = window.articlesData.getSortedArticles();
            var articlesGrid = document.getElementById('articlesGrid');
            var articleCount = document.getElementById('articleCount');
            var filterTags = document.getElementById('filterTags');
            var searchInput = document.getElementById('searchInput');
            var searchButton = document.getElementById('searchButton');
            var noResults = document.getElementById('noResults');
            var allTags = [];
            var activeFilters = new Set();
            var currentSearch = '';
            function initPage() {
                extractAllTags();
                generateFilterTags();
                displayArticles(allArticles);
                updateArticleCount(allArticles.length);
            }
            function extractAllTags() {
                var tagSet = new Set();
                allArticles.forEach(function(article) {
                    article.tags.forEach(function(tag) { tagSet.add(tag); });
                });
                allTags = Array.from(tagSet).sort();
            }
            function generateFilterTags() {
                filterTags.innerHTML = '';
                var allTag = document.createElement('div');
                allTag.className = 'filter-tag active';
                allTag.textContent = '全部';
                allTag.dataset.tag = '全部';
                allTag.addEventListener('click', function() {
                    activeFilters.clear();
                    document.querySelectorAll('.filter-tag').forEach(function(t) { t.classList.remove('active'); });
                    allTag.classList.add('active');
                    filterArticles();
                });
                filterTags.appendChild(allTag);
                allTags.forEach(function(tag) {
                    var tagElement = document.createElement('div');
                    tagElement.className = 'filter-tag';
                    tagElement.textContent = tag;
                    tagElement.dataset.tag = tag;
                    tagElement.addEventListener('click', function() {
                        tagElement.classList.toggle('active');
                        if (tagElement.classList.contains('active')) {
                            activeFilters.add(tag);
                        } else {
                            activeFilters.delete(tag);
                        }
                        if (activeFilters.size === 0) {
                            document.querySelector('.filter-tag[data-tag="全部"]').classList.add('active');
                        } else {
                            document.querySelector('.filter-tag[data-tag="全部"]').classList.remove('active');
                        }
                        filterArticles();
                    });
                    filterTags.appendChild(tagElement);
                });
                // 标签超过 1 行时显示展开按钮
                var btn = document.getElementById('tagsToggle');
                if (btn && allTags.length > 4) {
                    btn.style.display = 'inline-flex';
                }
            }
            window.toggleTags = function() {
                var tags = document.getElementById('filterTags');
                var btn = document.getElementById('tagsToggleText');
                if (tags.classList.contains('expanded')) {
                    tags.classList.remove('expanded');
                    btn.textContent = '展开全部标签 ▾';
                } else {
                    tags.classList.add('expanded');
                    btn.textContent = '收起标签 ▴';
                }
            };
            function displayArticles(articles) {
                articlesGrid.innerHTML = '';
                if (articles.length === 0) {
                    noResults.style.display = 'block';
                    return;
                }
                noResults.style.display = 'none';
                articles.forEach(function(article, index) {
                    var articleCard = document.createElement('a');
                    articleCard.href = (article.fileName || '').replace(/.html$/, '');
                    articleCard.className = 'article-card card-reveal';
                    articleCard.style.animationDelay = (index * 0.1) + 's';
                    var tagsHtml = '';
                    article.tags.forEach(function(tag) {
                        tagsHtml += '<span class="article-tag">' + escapeHtml(tag) + '</span>';
                    });
                    articleCard.innerHTML =
                        '<div class="article-content">' +
                            '<div class="article-meta">' +
                                '<span class="article-number">文章 #' + String(article.id).padStart(3,'0') + '</span>' +
                                '<span class="article-date">' + article.date + '</span>' +
                            '</div>' +
                            '<h3>' + escapeHtml(article.title) + '</h3>' +
                            '<p class="article-excerpt">' + escapeHtml(article.excerpt) + '</p>' +
                            '<div class="article-tags">' + tagsHtml + '</div>' +
                            '<div class="article-footer">' +
                                '<span class="read-more">阅读全文 <i class="fas fa-arrow-right"></i></span>' +
                                '<span class="read-time"><i class="far fa-clock"></i> 约' + article.readTime + '分钟</span>' +
                            '</div>' +
                        '</div>';
                    articlesGrid.appendChild(articleCard);
                });
            }
            function filterArticles() {
                var filtered = allArticles;
                if (activeFilters.size > 0) {
                    filtered = filtered.filter(function(article) {
                        return article.tags.some(function(tag) { return activeFilters.has(tag); });
                    });
                }
                if (currentSearch.trim() !== '') {
                    var term = currentSearch.toLowerCase().trim();
                    filtered = filtered.filter(function(article) {
                        return article.title.toLowerCase().indexOf(term) !== -1 ||
                               article.excerpt.toLowerCase().indexOf(term) !== -1 ||
                               article.tags.some(function(tag) { return tag.toLowerCase().indexOf(term) !== -1; });
                    });
                }
                displayArticles(filtered);
                updateArticleCount(filtered.length);
            }
            function updateArticleCount(count) { articleCount.textContent = count; }
            function performSearch() {
                var rawInput = searchInput.value;
                if (/<script|javascript:|on\w+\s*=|alert\s*\(|eval\s*\(|prompt\s*\(|confirm\s*\(|document\.cookie|\.innerHTML\s*=|expression\s*\(|<\s*iframe|<\s*img\s+onerror|onload\s*=/i.test(rawInput)) {
                    searchInput.value = '';
                    currentSearch = '';
                    filterArticles();
                    return;
                }
                currentSearch = rawInput;
                filterArticles();
            }
            searchButton.addEventListener('click', performSearch);
            searchInput.addEventListener('keyup', function(e) { if (e.key === 'Enter') performSearch(); });
            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e.preventDefault(); searchInput.focus(); }
                if (e.key === 'Escape' && searchInput.value !== '') { searchInput.value = ''; currentSearch = ''; filterArticles(); }
            });
            initPage();
            setTimeout(function() {
                document.querySelectorAll('.article-card').forEach(function(el) { el.classList.add('card-reveal'); });
            }, 100);
        });
    </script>    <script src="../js/js/blog-share.js"></script>
