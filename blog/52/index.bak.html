<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>加载中...</title>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
:root {
  --primary: #4a90d9;
  --success: #52c41a;
  --warning: #faad14;
  --danger: #f5222d;
  --info: #1890ff;
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --text: #e6edf3;
  --text2: #8b949e;
  --border: #30363d;
  --radius: 8px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--text);
  line-height: 1.8; min-height: 100vh;
}
#loader { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:20px; }
#loader .spinner { width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#loader p { color:var(--text2);font-size:14px; }

.article-header { padding:40px 20px 20px;text-align:center;border-bottom:1px solid var(--border);background:var(--bg2); }
.article-header h1 { font-size:28px;margin-bottom:8px; }
.article-meta { display:flex;gap:16px;justify-content:center;flex-wrap:wrap;font-size:13px;color:var(--text2); }
.article-meta span { display:flex;align-items:center;gap:4px; }
.article-tags { display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px; }
.tag { background:var(--bg3);color:var(--primary);padding:2px 10px;border-radius:12px;font-size:12px; }

.hero-zone {
  padding:80px 20px;text-align:center;
  background:linear-gradient(135deg,var(--bg2) 0%,var(--bg) 100%);
  border-bottom:1px solid var(--border);
}
.hero-zone h1 { font-size:36px;margin-bottom:12px; }
.hero-zone .lead { font-size:18px;color:var(--text2);margin-bottom:24px; }

.article-body { max-width:800px;margin:0 auto;padding:40px 20px; }
.article-body section { margin-bottom:48px; }
.article-body h1 { font-size:28px;margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--primary); }
.article-body h2 { font-size:24px;margin:32px 0 16px;padding-left:12px;border-left:4px solid var(--primary); }
.article-body h3 { font-size:20px;margin:24px 0 12px; }
.article-body h4 { font-size:18px;margin:20px 0 10px; }
.article-body p { margin-bottom:16px; }
.article-body p.lead { font-size:18px;color:var(--text2); }
.article-body p.muted { color:var(--text2);font-size:14px; }
.article-body p.small { font-size:13px;color:var(--text2); }
.article-body blockquote { border-left:4px solid var(--primary);padding:12px 20px;margin:16px 0;background:var(--bg2);border-radius:0 var(--radius) var(--radius) 0;color:var(--text2); }

.code-block { background:#0d1117;border:1px solid var(--border);border-radius:var(--radius);margin:16px 0;overflow:hidden; }
.code-block .code-header { display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text2); }
.code-block pre { padding:16px;overflow-x:auto;font-family:'Fira Code','Consolas',monospace;font-size:14px;line-height:1.6;white-space:pre-wrap; }
code { background:var(--bg3);padding:2px 6px;border-radius:4px;font-size:0.9em; }

.alert { padding:16px 20px;border-radius:var(--radius);margin:16px 0;border-left:4px solid; }
.alert.tip { background:rgba(82,196,26,0.1);border-color:var(--success); }
.alert.warning { background:rgba(250,173,20,0.1);border-color:var(--warning); }
.alert.danger { background:rgba(245,34,45,0.1);border-color:var(--danger); }
.alert.success { background:rgba(82,196,26,0.1);border-color:var(--success); }
.alert .alert-title { font-weight:600;margin-bottom:4px; }
.alert.tip .alert-title { color:var(--success); }
.alert.warning .alert-title { color:var(--warning); }
.alert.danger .alert-title { color:var(--danger); }

.btn { display:inline-flex;align-items:center;gap:8px;padding:10px 24px;border-radius:var(--radius);border:none;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;transition:all 0.2s;user-select:none; }
.btn.primary { background:var(--primary);color:white; }
.btn.primary:hover { background:#3a7bc8; }
.btn.secondary { background:var(--bg3);color:var(--text);border:1px solid var(--border); }
.btn.secondary:hover { background:var(--border); }
.btn.ghost { background:transparent;color:var(--primary);border:1px solid var(--primary); }
.btn.small { padding:6px 16px;font-size:12px; }

.badge { display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500; }
.badge.info { background:rgba(24,144,255,0.15);color:var(--info); }
.badge.warning { background:rgba(250,173,20,0.15);color:var(--warning); }
.badge.success { background:rgba(82,196,26,0.15);color:var(--success); }
.badge.danger { background:rgba(245,34,45,0.15);color:var(--danger); }

.card { background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all 0.2s; }
.card.hover:hover { transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,0.3); }

.grid { display:grid;gap:20px;margin:16px 0; }
.grid.cols-2 { grid-template-columns:repeat(2,1fr); }
.grid.cols-3 { grid-template-columns:repeat(3,1fr); }

.flex { display:flex;gap:12px;flex-wrap:wrap; }
.flex.center { justify-content:center;align-items:center;flex-direction:column;gap:16px;display:flex; }

.progress-bar { height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin:8px 0; }
.progress-bar .fill { height:100%;background:var(--primary);border-radius:4px;transition:width 0.5s; }

.timeline { position:relative;padding-left:24px;margin:16px 0; }
.timeline::before { content:'';position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--border); }
.timeline-item { position:relative;margin-bottom:20px; }
.timeline-item::before { content:'';position:absolute;left:-20px;top:4px;width:12px;height:12px;background:var(--primary);border-radius:50%;border:2px solid var(--bg); }

.stat-grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin:16px 0; }
.stat-item { text-align:center;padding:20px;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border); }
.stat-value { font-size:32px;font-weight:700;color:var(--primary); }
.stat-label { font-size:13px;color:var(--text2);margin-top:4px; }

.accordion { margin:16px 0; }
.accordion-pane { border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden; }
.accordion-header { padding:12px 16px;background:var(--bg2);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:500;user-select:none; }
.accordion-body { padding:16px;display:none; }
.accordion-pane.open .accordion-body { display:block; }

.article-footer { text-align:center;padding:40px 20px;border-top:1px solid var(--border);background:var(--bg2); }

ul, ol { padding-left:24px;margin:12px 0; }
li { margin-bottom:8px; }

details { margin:16px 0;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden; }
details summary { padding:12px 16px;background:var(--bg2);cursor:pointer;font-weight:500;user-select:none; }
details[open] summary { border-bottom:1px solid var(--border); }
details div { padding:16px; }

hr { border:none;border-top:1px solid var(--border);margin:32px 0; }

#error-box { max-width:600px;margin:80px auto;padding:40px;text-align:center;background:var(--bg2);border-radius:var(--radius);border:1px solid var(--danger); }
#error-box h2 { color:var(--danger);margin-bottom:12px; }

.back-link { display:inline-flex;align-items:center;gap:6px;color:var(--primary);text-decoration:none;font-size:14px;margin-bottom:20px; }
.back-link:hover { text-decoration:underline; }

img { max-width:100%;border-radius:var(--radius);margin:16px 0; }
</style>
</head>
<body>

<div id="loader"><div class="spinner"></div><p>正在加载 NextScript 文章...</p></div>
<div id="app" style="display:none;">
  <div id="header"></div>
  <div id="hero"></div>
  <div id="content" class="article-body"></div>
  <div id="footer" class="article-footer"></div>
</div>
<div id="error" style="display:none;"></div>

<script>
// ============================================================
// NextScript v1 解码器（修复版）
// ============================================================

const NS = (function() {
  // 工具函数
  const escapeHtml = function(s) {
    if (!s) return '';
    return s.replace(/&/g, '&amp;')
           .replace(/</g, '&lt;')
           .replace(/>/g, '&gt;');
  };
  
  // 行内格式解析（**粗体** *斜体* __下划线__ ~~删除线~~ `代码` [链接](url) ![图片](url)）
  const parseInline = function(text) {
    if (!text) return '';
    var result = text;
    // 粗体
    result = result.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // 斜体
    result = result.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // 下划线
    result = result.replace(/__(.+?)__/g, '<u>$1</u>');
    // 删除线
    result = result.replace(/~~(.+?)~~/g, '<del>$1</del>');
    // 行内代码
    result = result.replace(/`(.+?)`/g, '<code>$1</code>');
    // 链接 [文字](url)
    result = result.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" style="color:var(--primary)">$1</a>');
    // 图片 ![alt](url)
    result = result.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;margin:16px 0">');
    return result;
  };

  // 渲染单个区块
  const renderBlock = function(block) {
    if (!block || !block.type) return '';
    var t = block.type;
    var text = parseInline(block.text || '');
    
    // 标题
    if (t === 'h1' || t === 'h2' || t === 'h3' || t === 'h4' || t === 'h5' || t === 'h6') {
      var id = block.id ? ' id="' + block.id + '"' : '';
      return '<' + t + id + '>' + text + '</' + t + '>';
    }
    
    // 段落
    if (t === 'p') {
      var cls = block['class'] ? ' class="' + block['class'] + '"' : '';
      return '<p' + cls + '>' + text + '</p>';
    }
    
    // 引用
    if (t === 'quote') {
      var src = block.source ? '<br><em>— ' + escapeHtml(block.source) + '</em>' : '';
      return '<blockquote>' + text + src + '</blockquote>';
    }
    
    // 行内代码
    if (t === 'inline-code') {
      return '<code>' + escapeHtml(block.text || '') + '</code>';
    }
    
    // 链接
    if (t === 'link') {
      return '<a href="' + (block.href || '#') + '" style="color:var(--primary)">' + escapeHtml(block.text || '') + '</a>';
    }
    
    // 图片
    if (t === 'img' || t === 'image') {
      return '<img src="' + (block.src || '') + '" alt="' + (block.alt || '') + '" />';
    }
    
    // 分隔线
    if (t === 'hr') return '<hr>';
    
    // 代码块
    if (t === 'code') {
      var lang = block.lang || '';
      var title = block.title || '';
      var header = title ? '<div class="code-header"><span>' + escapeHtml(title) + '</span><span>' + lang + '</span></div>' : '';
      var codeText = escapeHtml(block.text || '');
      return '<div class="code-block">' + header + '<pre><code class="lang-' + lang + '">' + codeText + '</code></pre></div>';
    }
    
    // 无序列表
    if (t === 'ul' && block.items) {
      var lis = block.items.map(function(it) { return '<li>' + parseInline(it) + '</li>'; }).join('');
      return '<ul>' + lis + '</ul>';
    }
    
    // 有序列表
    if (t === 'ol' && block.items) {
      var lis = block.items.map(function(it) { return '<li>' + parseInline(it) + '</li>'; }).join('');
      return '<ol>' + lis + '</ol>';
    }
    
    // 描述列表
    if (t === 'dl' && block.items) {
      var dts = block.items.map(function(it) { return '<dt>' + escapeHtml(it.term || '') + '</dt><dd>' + parseInline(it.desc || '') + '</dd>'; }).join('');
      return '<dl>' + dts + '</dl>';
    }
    
    // 提示框
    if (t === 'alert') {
      var at = (block['alert-type'] || 'tip').toLowerCase();
      var title = block.title || '';
      var titleHtml = title ? '<div class="alert-title">' + escapeHtml(title) + '</div>' : '';
      return '<div class="alert ' + at + '">' + titleHtml + '<div>' + parseInline(block.text || '') + '</div></div>';
    }
    
    // 按钮
    if (t === 'button' || t === 'btn') {
      var bt = (block['button-type'] || 'primary').toLowerCase();
      var href = block.href || block.to || '#';
      var cls = 'btn ' + bt;
      var content = parseInline(block.text || '');
      if (href && href !== '#') {
        return '<a href="' + href + '" class="' + cls + '">' + content + '</a>';
      }
      return '<button class="' + cls + '">' + content + '</button>';
    }
    
    // 徽章
    if (t === 'badge') {
      var bt = (block['badge-type'] || 'info').toLowerCase();
      return '<span class="badge ' + bt + '">' + parseInline(block.text || '') + '</span>';
    }
    
    // 卡片
    if (t === 'card') {
      var hover = block.hover ? ' hover' : '';
      var inner = (block.blocks || []).map(renderBlock).join('');
      return '<div class="card' + hover + '">' + inner + '</div>';
    }
    
    // 折叠
    if (t === 'collapse') {
      var title = block.title || '展开';
      var inner = (block.blocks || []).map(renderBlock).join('');
      return '<details><summary>' + escapeHtml(title) + '</summary><div>' + inner + '</div></details>';
    }
    
    // 进度条
    if (t === 'progress') {
      var val = parseFloat(block.value) || 0;
      var max = parseFloat(block.max) || 100;
      var pct = Math.round(val / max * 100);
      return '<div class="progress-bar"><div class="fill" style="width:' + pct + '%"></div></div>';
    }
    
    // 网格布局
    if (t === 'grid') {
      var cols = parseInt(block.cols) || 2;
      var gap = parseInt(block.gap) || 20;
      var cells = (block.cells || []).map(function(cellBlocks) {
        return '<div>' + (cellBlocks || []).map(renderBlock).join('') + '</div>';
      }).join('');
      return '<div class="grid cols-' + Math.min(cols, 3) + '" style="gap:' + gap + 'px">' + cells + '</div>';
    }
    
    // 弹性布局
    if (t === 'flex') {
      var dir = block.direction || 'row';
      var gap = parseInt(block.gap) || 12;
      var wrap = block.wrap ? 'flex-wrap:wrap;' : '';
      var items = (block.items || []).map(renderBlock).join('');
      return '<div style="display:flex;flex-direction:' + dir + ';gap:' + gap + 'px;' + wrap + '">' + items + '</div>';
    }
    
    // 居中
    if (t === 'center') {
      var inner = (block.blocks || []).map(renderBlock).join('');
      return '<div style="text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px">' + inner + '</div>';
    }
    
    // 统计数字
    if (t === 'stat') {
      var val = block.value || '0';
      var label = block.label || '';
      var prefix = block.prefix || '';
      var suffix = block.suffix || '';
      return '<div class="stat-item"><div class="stat-value">' + prefix + val + suffix + '</div><div class="stat-label">' + label + '</div></div>';
    }
    
    // 时间线
    if (t === 'timeline') {
      var items = (block.items || []).map(function(it) {
        return '<div class="timeline-item"><strong>' + escapeHtml(it.date || '') + '</strong> ' + parseInline(it.text || '') + '</div>';
      }).join('');
      return '<div class="timeline">' + items + '</div>';
    }
    
    // 手风琴
    if (t === 'accordion') {
      var panes = (block.panes || []).map(function(p) {
        var title = p.title || '项';
        var text = parseInline(p.text || '');
        return '<div class="accordion-pane"><div class="accordion-header" onclick="this.parentElement.classList.toggle(\'open\')">' + escapeHtml(title) + ' <span>▼</span></div><div class="accordion-body">' + text + '</div></div>';
      }).join('');
      return '<div class="accordion">' + panes + '</div>';
    }
    
    // 分节
    if (t === 'section') {
      var id = block.id ? ' id="' + block.id + '"' : '';
      var inner = (block.blocks || []).map(renderBlock).join('');
      return '<section' + id + '>' + inner + '</section>';
    }
    
    // 默认
    return '<div class="ns-' + t + '">' + parseInline(block.text || '') + '</div>';
  };

  // 主函数：加载并渲染
  const loadAndRender = async function(articleId) {
    var url = './' + articleId + '.blog';
    var resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    var yamlText = await resp.text();
    
    // 用 js-yaml 解析
    var data = window.jsyaml.load(yamlText);
    if (!data || !data.meta || !data.body) throw new Error('无效的 NextScript 文件格式');
    
    var meta = data.meta;
    var body = data.body;
    
    // 设置标题
    if (meta.title) {
      document.title = meta.title;
      var headerEl = document.getElementById('header');
      if (headerEl) {
        var tagsHtml = '';
        if (meta.tags && meta.tags.length > 0) {
          tagsHtml = '<div class="article-tags">' + meta.tags.map(function(t) { return '<span class="tag">' + escapeHtml(t) + '</span>'; }).join('') + '</div>';
        }
        headerEl.innerHTML = '<div class="article-header"><h1>' + escapeHtml(meta.title) + '</h1><div class="article-meta">' + (meta.author ? '<span>✍️ ' + escapeHtml(meta.author) + '</span>' : '') + (meta.date ? '<span>📅 ' + escapeHtml(meta.date) + '</span>' : '') + '</div>' + tagsHtml + '</div>';
      }
    }
    
    // 主题
    if (meta.theme === 'light') {
      document.documentElement.style.setProperty('--bg', '#ffffff');
      document.documentElement.style.setProperty('--bg2', '#f6f8fa');
      document.documentElement.style.setProperty('--bg3', '#eaeef2');
      document.documentElement.style.setProperty('--text', '#1f2328');
      document.documentElement.style.setProperty('--text2', '#656d76');
      document.documentElement.style.setProperty('--border', '#d0d7de');
    }
    
    // 分离 hero / content / footer
    var heroHtml = '';
    var contentHtml = '';
    var footerHtml = '';
    
    for (var i = 0; i < body.length; i++) {
      var block = body[i];
      if (block.type === 'section' && block.id === 'hero') {
        heroHtml = renderBlock(block);
      } else if (block.type === 'section' && block.id === 'footer') {
        footerHtml = renderBlock(block);
      } else {
        contentHtml += renderBlock(block);
      }
    }
    
    // 写入 DOM
    if (heroHtml) {
      document.getElementById('hero').innerHTML = heroHtml;
    } else {
      document.getElementById('hero').style.display = 'none';
    }
    
    document.getElementById('content').innerHTML = '<a href="/wz.html" class="back-link">← 返回文章列表</a>' + contentHtml;
    
    if (footerHtml) {
      document.getElementById('footer').innerHTML = footerHtml;
    } else {
      document.getElementById('footer').style.display = 'none';
    }
    
    return data;
  };

  return { loadAndRender: loadAndRender, renderBlock: renderBlock };
})();

// 主程序
(function() {
  var loader = document.getElementById('loader');
  var app = document.getElementById('app');
  var errorBox = document.getElementById('error');
  
  function getArticleId() {
    var path = window.location.pathname;
    var match = path.match(/\/blog\/(\d+)/);
    return match ? match[1] : null;
  }
  
  var articleId = getArticleId();
  if (!articleId) {
    loader.style.display = 'none';
    errorBox.style.display = 'block';
    errorBox.innerHTML = '<div id="error-box"><h2>😿 无法识别文章 ID</h2><p>请将文章放在 blog/{id}/ 文件夹下，并放置 {id}.blog 文件。</p><p style="margin-top:16px"><a href="/" style="color:var(--primary)">← 返回首页</a></p></div>';
    return;
  }
  
  NS.loadAndRender(articleId).then(function() {
    loader.style.display = 'none';
    app.style.display = 'block';
  }).catch(function(e) {
    loader.style.display = 'none';
    errorBox.style.display = 'block';
    errorBox.innerHTML = '<div id="error-box"><h2>😿 加载失败</h2><p>' + escapeHtml(e.message) + '</p><p style="margin-top:16px"><a href="/" style="color:var(--primary)">← 返回首页</a></p></div>';
  });
})();
</script>

</body>
</html>
