<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="../fanv.ico">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            padding: 50px 40px;
            max-width: 520px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);

        .emoji {

        }
        h1 {
            color: #333;
            font-size: 1.8rem;

        }
        p {
            color: #666;
            line-height: 1.8;

            font-size: 1rem;
        }
        .browsers {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .browser-btn {
            padding: 12px 24px;
            border-radius: 10px;
            text-decoration: none;
            color: #fff;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .browser-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }
        .chrome { background: #3366ff; }
        .edge { background: #0078d4; }

        <div class="browsers">
            <a href="https://www.google.com/chrome/" target="_blank" class="browser-btn chrome">Chrome</a>
            <a href="https://www.microsoft.com/edge" target="_blank" class="browser-btn edge">Edge</a>
            <a href="https://www.mozilla.org/firefox/" target="_blank" class="browser-btn firefox">Firefox</a>
