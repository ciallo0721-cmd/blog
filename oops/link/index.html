<body>
    <div class="card">
        <div class="icon">🚧</div>
        <h1>即将前往外部链接</h1>
        <p>你正在离开 <strong>ciallo0721-cmd.top</strong>，访问以下外部网站喵～</p>
        <p style="font-size:0.92rem;color:#8e8e93;">本站不对第三方网站的内容和隐私负责的说～</p>

        <div class="url-box" id="urlBox">
            <span>🔗 目标链接</span>
            <span id="targetUrl">加载中…</span>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" id="continueBtn">
                <span>→</span> 继续访问
            </button>
            <button class="btn btn-secondary" onclick="history.back()">
                ← 返回上页
            </button>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="trustDomain">
            <label for="trustDomain">信任此域名，下次不再提示</label>
        </div>

        <div class="footer-note">
            本站使用外部链接提醒机制，保护你的浏览安全喵～
        </div>
    </div>

    <script>
        (function() {
            var urlBox = document.getElementById('urlBox');
            var targetEl = document.getElementById('targetUrl');
            var continueBtn = document.getElementById('continueBtn');
            var trustCheckbox = document.getElementById('trustDomain');

            // 获取 url 参数
            var params = new URLSearchParams(window.location.search);
            var targetUrl = params.get('url');

            if (!targetUrl) {
                targetEl.textContent = '⚠️ 未指定跳转链接';
                continueBtn.disabled = true;
                continueBtn.style.opacity = '0.5';
                continueBtn.style.cursor = 'not-allowed';
                return;
            }

            // 解码并显示
            var decodedUrl = decodeURIComponent(targetUrl);
            targetEl.textContent = decodedUrl;

            // 提取域名用于信任功能
            var domain = '';
            try {
                domain = new URL(decodedUrl).hostname;
            } catch(e) {
                domain = decodedUrl;
            }

            // 点击继续访问
            continueBtn.addEventListener('click', function() {
                if (trustCheckbox.checked && domain) {
                    // 将信任域名存入 localStorage
                    var trusted = JSON.parse(localStorage.getItem('oops_trusted_domains') || '[]');
                    if (!trusted.includes(domain)) {
                        trusted.push(domain);
                        localStorage.setItem('oops_trusted_domains', JSON.stringify(trusted));
                    }
                }
                window.location.href = decodedUrl;
            });
        })();
    </script>
