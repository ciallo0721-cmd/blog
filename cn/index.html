<div class="container">

    <!-- ===== 页面标题 ===== -->
    <div class="page-header">
        <h1>中华历代诗人</h1>
        <p>按朝代整理中国历代诗人、词人及其代表作，数据陆续补充中。</p>
    </div>

    <!-- ===== 搜索框 ===== -->
    <div class="mw-search-wrap">
        <input type="text" class="mw-search-input" id="searchInput" placeholder="搜索诗人、作品或朝代…">
        <button class="mw-search-btn" id="searchBtn" aria-label="搜索"><svg viewBox="0 0 20 20" width="18" height="18"><circle cx="9" cy="9" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="13" y1="13" x2="18" y2="18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>

    <!-- ===== 朝代选项卡 ===== -->
    <div class="category-nav" id="categoryNav">
        <button class="category-btn active" data-cat="all">全部</button>
    </div>

    <!-- ===== 诗人列表 ===== -->
    <div class="wiki-main" id="wikiMain">
        <div class="wiki-section-title" id="sectionTitle">
            <span id="sectionTitleText">全部诗人</span>
            <span class="cat-count" id="catCount"></span>
        </div>
        <div class="poet-grid" id="poetGrid"></div>
    </div>

    <!-- ===== 投稿&修复板块 ===== -->
    <div class="contribute-section">
        <div class="contribute-header">
            <h2><svg viewBox="0 0 20 20" width="20" height="20" style="vertical-align:-4px;margin-right:6px"><rect x="2" y="3" width="16" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2 5l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>投稿 & 修复</h2>
            <span class="badge">欢迎贡献</span>
        </div>

        <div class="contribute-tabs">
            <button class="contribute-tab-btn active" data-tab="submit"><svg viewBox="0 0 18 18" width="16" height="16" style="vertical-align:-3px;margin-right:4px"><path d="M2 16.25V20h3.75L16.81 8.94l-3.75-3.75L2 16.25zM19.71 6.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" fill="currentColor"/></svg>投稿新诗人</button>
            <button class="contribute-tab-btn" data-tab="fixes"><svg viewBox="0 0 18 18" width="16" height="16" style="vertical-align:-3px;margin-right:4px"><path d="M14.7 6.3l-1.4-1.4L3 15.2V17h1.8l10.3-10.3zM6.6 1.5L3.4 4.7l1.4 1.4L8 2.9 6.6 1.5zm3.2 3.2L6.6 7.9l1.4 1.4 3.2-3.2-1.4-1.4zm5 1.6l-1.4 1.4 1.4 1.4 1.4-1.4-1.4-1.4z" fill="currentColor"/></svg>修复记录</button>
        </div>

        <!-- 投稿表单 -->
        <div class="contribute-tab-content active" id="tab-submit">
            <p style="font-size:0.88rem;color:var(--mw-text-secondary);margin-bottom:20px;">
                发现遗漏的诗人，或现有数据需要修正？填写下方表单后点击提交，将自动打开邮件客户端发送投稿喵～
                支持<strong>新增诗人</strong>和<strong>修正已有数据</strong>。
            </p>

            <div class="contribute-form" id="contributeForm">
                <div class="contribute-form-grid">
                    <div class="contribute-form-group">
                        <label class="required">诗人姓名</label>
                        <input type="text" id="subName" placeholder="如：李白">
                    </div>
                    <div class="contribute-form-group">
                        <label class="required">朝代</label>
                        <select id="subDynasty"></select>
                    </div>
                    <div class="contribute-form-group">
                        <label>生卒年</label>
                        <input type="text" id="subYears" placeholder="如：701—762">
                    </div>
                    <div class="contribute-form-group">
                        <label>投稿人昵称</label>
                        <input type="text" id="subAuthor" placeholder="你的昵称（选填）">
                    </div>
                    <div class="contribute-form-group full">
                        <label>代表作</label>
                        <textarea id="subWorks" placeholder="如：〈静夜思〉〈将进酒〉〈蜀道难〉"></textarea>
                        <span class="hint">多个作品用书名号括起来，空格或逗号分隔</span>
                    </div>
                    <div class="contribute-form-group full">
                        <label>简介</label>
                        <textarea id="subDesc" placeholder="诗人简介、风格特点、历史地位等…"></textarea>
                    </div>
                    <div class="contribute-form-group full">
                        <label>标签</label>
                        <input type="text" id="subTags" placeholder="如：浪漫主义、边塞、乐府（逗号分隔）">
                    </div>
                </div>
                <div class="contribute-submit-row">
                    <button class="contribute-btn" id="genSubmit"><svg viewBox="0 0 18 18" width="16" height="16" style="vertical-align:-3px;margin-right:4px"><rect x="1" y="3" width="16" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1 5l8 6 8-6" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>通过邮件提交</button>
                    <button class="contribute-btn-reset" id="resetForm"><svg viewBox="0 0 18 18" width="16" height="16" style="vertical-align:-3px;margin-right:4px"><path d="M15.5 2.5A7 7 0 008 2a7 7 0 00-5.5 10" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 15.5A7 7 0 008 16a7 7 0 005.5-10" fill="none" stroke="currentColor" stroke-width="1.5"/><polygon points="8,0 11,4 8,4" fill="currentColor"/><polygon points="10,18 7,14 10,14" fill="currentColor"/></svg>重置表单</button>
                </div>
            </div>

        </div>

        <!-- 修复记录 -->
        <div class="contribute-tab-content" id="tab-fixes">
            <p style="font-size:0.88rem;color:var(--mw-text-secondary);margin-bottom:20px;">
                以下是诗人数据的修复与更新记录。发现错误也欢迎通过「投稿新诗人」Tab 提交修正喵～
            </p>
            <div class="fix-log" id="fixLog"></div>
        </div>
    </div>

</div>
