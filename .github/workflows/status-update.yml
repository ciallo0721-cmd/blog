name: 自动更新状态记录

on:
  # 每次 push 到 main 时自动触发
  push:
    branches: [main]
  # 手动触发（可指定状态、标题、描述）
  workflow_dispatch:
    inputs:
      status:
        description: '状态'
        required: true
        type: choice
        default: 'green'
        options:
          - green
          - yellow
          - red
      title:
        description: '更新标题'
        required: true
        type: string
        default: '网站更新'
      desc:
        description: '详细描述（可选）'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 获取最新 commit 信息
        id: commit
        run: |
          COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          COMMIT_DATE=$(git log -1 --pretty=format:"%ad" --date=format:"%Y年%-m月%-d日")
          echo "msg=${COMMIT_MSG}" >> $GITHUB_OUTPUT
          echo "date=${COMMIT_DATE}" >> $GITHUB_OUTPUT

      - name: 追加状态记录
        run: |
          # 获取今天的日期（北京时间）
          TODAY=$(TZ='Asia/Shanghai' date +'%Y年%-m月%-d日')

          # 确定状态：手动触发用输入值，自动触发默认 green
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STATUS="${{ inputs.status }}"
            TITLE="${{ inputs.title }}"
            DESC="${{ inputs.desc }}"
          else
            STATUS="green"
            
            TITLE="一切正常喵～"
            DESC=""
          fi

          # 转义特殊字符（防止 JS 语法错误）
          ESCAPED_TITLE=$(echo "$TITLE" | sed "s/'/\\\\'/g" | sed 's/"/\\"/g')
          ESCAPED_DESC=$(echo "$DESC" | sed "s/'/\\\\'/g" | sed 's/"/\\"/g')

          # 构造新记录
          NEW_ENTRY="    {\n        date: \"${TODAY}\",\n        status: \"${STATUS}\",\n        title: \"${ESCAPED_TITLE}\",\n        desc: \"${ESCAPED_DESC}\"\n    },"

          # 检查今天是否已有记录，避免重复
          if grep -q "date: \"${TODAY}\"" status-data.js; then
            echo "⚠️ 今天已有状态记录，跳过自动追加"
            echo "  如需覆盖，请使用 workflow_dispatch 手动触发"
            exit 0
          fi

          # 在 window.statusHistory = [ 之后插入新记录
          sed -i "/^window\.statusHistory = \[/a\\${NEW_ENTRY}" status-data.js

          echo "✅ 状态记录已追加："
          echo "   日期: ${TODAY}"
          echo "   状态: ${STATUS}"
          echo "   标题: ${TITLE}"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status-data.js
          if git diff --cached --quiet; then
            echo "📋 无变更，跳过提交"
          else
            git commit -m "📊 auto: 更新网站状态记录 $(TZ='Asia/Shanghai' date +'%Y-%m-%d')"
            git push
            echo "✅ 状态记录已提交并推送"
          fi
