name: Auto Update Sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'
  push:
    branches: [main]
    paths:
      - 'blog/**'
      - '*.html'
      - '**/*.html'

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate sitemap.xml with URL encoding
        run: |
          python3 << 'PYEOF'
          import os, re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import quote

          SITE_URL = "https://ciallo0721-cmd.top"

          def encode_url_path(path):
              """URL 编码路径中的非 ASCII 字符，并对 & 做 XML 转义"""
              encoded = quote(path, safe='/:@!$\'()*+,;=-._~')
              encoded = encoded.replace('&', '&amp;')
              if not encoded.endswith('/') and '.' not in encoded:
                  encoded += '/'
              return encoded

          # 递归扫描 blog/ 下的 index.html（排除 decoder/ 和 test/）
          def find_articles(blog_dir):
              articles = []
              blog_path = Path(blog_dir)
              for idx in blog_path.rglob("index.html"):
                  parent = idx.parent
                  # 跳过 decoder/ 和 test/ 目录
                  if "decoder" in parent.parts or "test" in parent.parts:
                      continue
                  rel_path = idx.relative_to(".")
                  lastmod = datetime.fromtimestamp(idx.stat().st_mtime).strftime("%Y-%m-%d")
                  articles.append((str(rel_path.parent.as_posix()) + "/", lastmod))
              return articles

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
              '  <!-- ========== 站点地图 (自动生成) ========== -->'
          ]

          # 静态页面
          static_pages = [
              ("index.html",           "1.0", "weekly"),
              ("blog/",                "0.9", "daily"),
              ("aboutme.html",         "0.7", "yearly"),
              ("adss.html",            "0.6", "yearly"),
              ("privacy.html",         "0.5", "yearly"),
              ("help.html",            "0.5", "yearly"),
              ("status.html",          "0.6", "monthly"),
              ("wiki/index.html",      "0.8", "weekly"),
          ]
          for path, priority, freq in static_pages:
              lines.extend([
                  '  <url>',
                  f'    <loc>{SITE_URL}/{encode_url_path(path)}</loc>',
                  f'    <lastmod>{datetime.now().strftime("%Y-%m-%d")}</lastmod>',
                  f'    <changefreq>{freq}</changefreq>',
                  f'    <priority>{priority}</priority>',
                  '  </url>',
              ])

          # 游戏页面
          game_pages = [
              ("bjqy/index.html",     "0.6", "monthly"),
              ("fors/index.html",     "0.6", "monthly"),
              ("LAIDB/index.html",    "0.6", "monthly"),
              ("zmdspp/indexzm.html", "0.6", "monthly"),
              ("91/index.html",       "0.6", "monthly"),
              ("dkdfj/index.html",    "0.6", "monthly"),
          ]
          for path, priority, freq in game_pages:
              lines.extend([
                  '  <url>',
                  f'    <loc>{SITE_URL}/{encode_url_path(path)}</loc>',
                  f'    <lastmod>{datetime.now().strftime("%Y-%m-%d")}</lastmod>',
                  f'    <changefreq>{freq}</changefreq>',
                  f'    <priority>{priority}</priority>',
                  '  </url>',
              ])

          # 博客文章（递归扫描）
          articles = find_articles("blog")
          if articles:
              print(f"📝 发现 {len(articles)} 篇博客文章")
              for art_path, lastmod in articles:
                  lines.extend([
                      '  <url>',
                      f'    <loc>{SITE_URL}/{encode_url_path(art_path)}</loc>',
                      f'    <lastmod>{lastmod}</lastmod>',
                      '    <changefreq>monthly</changefreq>',
                      '    <priority>0.6</priority>',
                      '  </url>',
                  ])
          else:
              print("⚠️ 未找到博客文章，请检查 blog/ 目录结构")

          lines.append('</urlset>')
          sitemap = '\n'.join(lines)

          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write(sitemap)

          print("✅ sitemap.xml 生成完成！")
          PYEOF

      - name: Show sitemap preview
        run: |
          echo "=== sitemap.xml 预览 ==="
          head -30 sitemap.xml
          echo "..."
          echo "=== 总共 $(grep -c '<url>' sitemap.xml) 个 URL ==="

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "🗺️ auto: 更新网站地图 $(date +'%Y-%m-%d')"
            git push
            echo "✅ sitemap.xml 已提交并推送"
          else
            echo "📋 sitemap.xml 无变化，跳过"
          fi
