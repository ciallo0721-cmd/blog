name: 每日自动打包 EXE 和 APK

on:
  # 每天凌晨 2 点自动运行（北京时间）
  schedule:
    - cron: '0 18 * * *'
  
  # 推送到 main 分支时自动运行
  push:
    branches: [ main ]
    paths:
      - 'build/**'
      - 'index.html'
      - '.github/workflows/daily-build.yml'
  
  # 手动触发
  workflow_dispatch:

jobs:
  # ========== 打包 EXE (使用 Electron) ==========
  build-exe:
    name: 打包 EXE (Electron)
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 创建 Electron 项目
        run: |
          mkdir electron-app
          cd electron-app
          npm init -y
          npm install electron electron-builder --save-dev
      
      - name: 创建 main.js
        shell: pwsh
        run: |
          $content = @"
          const { app, BrowserWindow } = require('electron')
          const path = require('path')
          
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 900,
              minWidth: 800,
              minHeight: 600,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            })
            win.loadURL('https://91vip.xn--32v.ink/')
          }
          
          app.whenReady().then(() => {
            createWindow()
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow()
            })
          })
          
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit()
          })
          "@
          $content | Out-File -FilePath "electron-app/main.js" -Encoding utf8 -NoNewline
      
      - name: 更新 package.json
        run: |
          cd electron-app
          npm pkg set scripts.start="electron ."
          npm pkg set scripts.build="electron-builder"
          npm pkg set main="main.js"
          npm pkg set build.appId="com.ciallo0721cmd.website"
          npm pkg set build.productName="ciallo0721-cmd"
          npm pkg set build.directories.output="dist"
          npm pkg set build.win.target="nsis"
      
      - name: 打包 EXE
        working-directory: electron-app
        run: npm run build -- --win
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        continue-on-error: true
      
      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: ciallo0721-cmd-exe
          path: electron-app/dist/*.exe
          if-no-files-found: warn

  # ========== 打包 APK ==========
  build-apk:
    name: 打包 APK (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 生成 Android 项目
        run: |
          python build/build_apk.py
      
      - name: 构建 APK (Release)
        working-directory: build/android_project
        run: gradle assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ciallo0721-cmd-apk
          path: build/android_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ========== 创建 Release ==========
  create-release:
    name: 创建每日 Release
    needs: [build-exe, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 下载 EXE 产物
        uses: actions/download-artifact@v4
        with:
          name: ciallo0721-cmd-exe
          path: ./artifacts/exe
      
      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: ciallo0721-cmd-apk
          path: ./artifacts/apk
      
      - name: 获取当前日期
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
      
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-${{ steps.date.outputs.date }}
          name: 每日构建 ${{ steps.date.outputs.date }}
          body: |
            📦 每日自动构建版本
            
            ## 下载
            - **Windows 桌面应用**: ciallo0721-cmd.exe
            - **Android 应用**: app-release-unsigned.apk
            
            ## 安装说明
            ### Windows
            1. 下载 ciallo0721-cmd.exe
            2. 运行即可（无需安装）
            
            ### Android
            1. 下载 app-release-unsigned.apk
            2. 在手机上允许"安装未知来源应用"
            3. 安装并运行
            
            ## 更新日志
            构建时间: ${{ steps.date.outputs.date }}
            自动构建，包含最新网站内容
          files: |
            ./artifacts/exe/*.exe
            ./artifacts/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
