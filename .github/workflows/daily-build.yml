name: 每日自动打包 EXE 和 APK

on:
  # 每天凌晨 2 点自动运行（北京时间）
  schedule:
    - cron: '0 18 * * *'
  
  # 推送到 main 分支时自动运行
  push:
    branches: [ main ]
    paths:
      - 'build/**'
      - 'index.html'
      - '.github/workflows/daily-build.yml'
  
  # 手动触发
  workflow_dispatch:

jobs:
  # ========== 打包 EXE (使用 Electron) ==========
  build-exe:
    name: 打包 EXE (Electron)
    runs-on: windows-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 创建 Electron 项目
        run: |
          mkdir electron-app
          cd electron-app
          npm init -y
          npm install electron electron-builder --save-dev
        shell: bash
      
      - name: 创建 main.js
        run: |
          cat > electron-app/main.js << 'EOF'
          const { app, BrowserWindow } = require('electron')
          const path = require('path')
          
          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 900,
              minWidth: 800,
              minHeight: 600,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            })
            win.loadURL('https://91vip.xn--32v.ink/')
          }
          
          app.whenReady().then(() => {
            createWindow()
            app.on('activate', () => {
              if (BrowserWindow.getAllWindows().length === 0) createWindow()
            })
          })
          
          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit()
          })
          EOF
      
      - name: 更新 package.json
        run: |
          cd electron-app
          npm set-script start "electron ."
          npm set-script build "electron-builder"
          npm pkg set main "main.js"
          npm pkg set build.appId "com.ciallo0721cmd.website"
          npm pkg set build.productName "ciallo0721-cmd"
          npm pkg set build.directories.output "dist"
          npm pkg set build.win.target "nsis"
      
      - name: 打包 EXE
        working-directory: electron-app
        run: npm run build -- --win
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
      
      - name: 上传 EXE 产物
        uses: actions/upload-artifact@v4
        with:
          name: ciallo0721-cmd-exe
          path: electron-app/dist/*.exe
          if-no-files-found: error

  # ========== 打包 APK ==========
  build-apk:
    name: 打包 APK (Android)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
      
      - name: 生成 Android 项目并构建
        run: |
          python build/build_apk.py
          cd build/android_project
          chmod +x gradlew
          ./gradlew assembleRelease
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
      
      - name: 签名 APK（调试用，发布需替换密钥）
        working-directory: build/android_project
        run: |
          # 生成调试密钥（仅用于测试）
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US" || true
          # 签名 APK
          jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 -keystore debug.keystore -storepass android app/build/outputs/apk/release/app-release-unsigned.apk androiddebugkey || true
        continue-on-error: true
      
      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: ciallo0721-cmd-apk
          path: build/android_project/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

  # ========== 创建 Release ==========
  create-release:
    name: 创建每日 Release
    needs: [build-exe, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: 下载 EXE 产物
        uses: actions/download-artifact@v4
        with:
          name: ciallo0721-cmd-exe
          path: ./artifacts/exe
      
      - name: 下载 APK 产物
        uses: actions/download-artifact@v4
        with:
          name: ciallo0721-cmd-apk
          path: ./artifacts/apk
      
      - name: 获取当前日期
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        shell: bash
      
      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: daily-${{ steps.date.outputs.date }}
          name: 每日构建 ${{ steps.date.outputs.date }}
          body: |
            📦 每日自动构建版本
            
            ## 下载
            - **Windows 桌面应用**: ciallo0721-cmd.exe
            - **Android 应用**: app-release.apk
            
            ## 安装说明
            ### Windows
            1. 下载 ciallo0721-cmd.exe
            2. 运行即可（无需安装）
            
            ### Android
            1. 下载 app-release.apk
            2. 在手机上允许"安装未知来源应用"
            3. 安装并运行
            
            ## 更新日志
            构建时间: ${{ steps.date.outputs.date }}
            自动构建，包含最新网站内容
          files: |
            ./artifacts/exe/*.exe
            ./artifacts/apk/**/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
