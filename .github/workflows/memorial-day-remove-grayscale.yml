name: 哀悼日灰度移除

on:
  schedule:
    # 9月19日 00:00 UTC（北京时间 09月19日 08:00）
    - cron: '0 0 19 9 *'
    # 12月14日 00:00 UTC（北京时间 12月14日 08:00）
    - cron: '0 0 14 12 *'
  workflow_dispatch:  # 允许手动触发，方便测试

jobs:
  remove-grayscale:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 从 index.html 移除灰度样式
        run: |
          # 检查是否存在灰度标记
          if ! grep -q '<!-- MEMORIAL-DAY-GRAYSCALE -->' index.html; then
            echo "灰度样式不存在，无需移除"
            exit 0
          fi

          # 删除灰度代码块（包括注释标记和脚本行）
          sed -i '/<!-- MEMORIAL-DAY-GRAYSCALE -->/,/<!-- \/MEMORIAL-DAY-GRAYSCALE -->/d' index.html

          echo "灰度样式移除完成"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # 如果没有变更则跳过
          if git diff --cached --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "✨ 哀悼日结束：移除全站灰度模式"
            git push
          fi
