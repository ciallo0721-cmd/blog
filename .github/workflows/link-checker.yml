name: 全站死链检查器

on:
  schedule:
    # 每周一 08:00 北京时间（UTC 00:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    name: 检查全站死链

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Lychee 链接检查器
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --base-url https://91vip.xn--32v.ink
            --max-concurrency 64
            --timeout 30
            --retry-wait-time 5
            --max-retries 3
            --accept 200..=299,403,405
            --exclude "localhost"
            --exclude "127.0.0.1"
            --exclude "file://"
            --format markdown
            "./**/*.html"
            "./**/*.md"
          output: ./lychee-report.md
          fail: false
          jobSummary: true

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: lychee-report.md
          retention-days: 30

      - name: 检查报告是否有死链并创建 Issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 报告内容预览 ==="
          head -50 lychee-report.md
          echo "=== 结束预览 ==="

          # 用 Python 解析 lychee markdown 报告，检测 ✗ 错误标记
          python3 -c "
          import sys
          import re

          try:
              with open('lychee-report.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              # lychee markdown 用 ✗ 标记错误链接，也检查 [404] 等状态码
              has_errors = bool(re.search(r'[✗❌×]', content)) or bool(re.search(r'$$\d{3}$$', content))
              if has_errors:
                  print('HAS_ERRORS=true')
              else:
                  print('HAS_ERRORS=false')
          except Exception as e:
              print(f'读取报告失败: {e}', file=sys.stderr)
              print('HAS_ERRORS=false')
          " >> $GITHUB_ENV

          # 如果检测到错误，创建 Issue
          if [ "$HAS_ERRORS" = "true" ]; then
            echo "::notice::发现死链，创建 Issue..."
            # 截取报告前 60000 字符（GitHub Issue body 上限 65536）
            python3 -c "
          import sys
          try:
              with open('lychee-report.md', 'r', encoding='utf-8') as f:
                  content = f.read()
              # 截断到 60000 字符，避免超出 Issue body 限制
              if len(content) > 60000:
                  content = content[:60000] + '\n\n> ... 报告过长已截断，请下载完整报告查看'
              print(content)
          except Exception as e:
              print('无法读取报告文件')
          " > /tmp/issue-body.md

            gh issue create \
              --title "🔗 全站死链检测报告 - $(date +%Y-%m-%d)" \
              --body-file /tmp/issue-body.md \
              --label "bug" \
              --label "dead-link"
          else
            echo "::notice::未发现死链，无需创建 Issue"
          fi
