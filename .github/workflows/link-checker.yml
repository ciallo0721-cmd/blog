name: 全站死链检查器

on:
  schedule:
    # 每周一 08:00 北京时间（UTC 00:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: read
  issues: write

jobs:
  link-check:
    runs-on: ubuntu-latest
    name: 检查全站死链

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Lychee 链接检查器
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --base-url https://91vip.xn--32v.ink
            --max-concurrency 64
            --timeout 30
            --retry-wait-time 5
            --max-retries 3
            --accept 200..=299,403,405
            --exclude "localhost"
            --exclude "127.0.0.1"
            --exclude "file://"
            --format markdown
            "./**/*.html"
            "./**/*.md"
          output: ./lychee-report.md
          fail: false
          jobSummary: true

      - name: 上传检查报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: lychee-report.md
          retention-days: 30

      - name: 检查报告并创建 Issue（有死链时）
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "检查报告内容..."
          cat lychee-report.md

          # 检查报告中是否有死链（lychee markdown 用 ✗ 标记错误链接）
          if grep -qE '✗|<span.*color:red|\[Error\]|Errors:' lychee-report.md 2>/dev/null; then
            echo "::notice::发现死链，创建 Issue..."
            gh issue create \
              --title "🔗 全站死链检测报告 - $(date +%Y-%m-%d)" \
              --body-file lychee-report.md \
              --label "bug" \
              --label "dead-link"
          else
            echo "::notice::未发现死链，无需创建 Issue"
          fi
