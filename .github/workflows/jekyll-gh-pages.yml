# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Generate sitemap.xml
        run: |
          python3 << 'PYEOF'
          import os, re
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import quote

          SITE_URL = "https://ciallo0721-cmd.top"

          def encode_url_path(path):
              encoded = quote(path, safe='/:@!$\'()*+,;=-._~')
              encoded = encoded.replace('&', '&amp;')
              if not encoded.endswith('/') and '.' not in encoded:
                  encoded += '/'
              return encoded

          def find_articles(blog_dir):
              articles = []
              blog_path = Path(blog_dir)
              for idx in blog_path.rglob("index.html"):
                  parent = idx.parent
                  if "decoder" in parent.parts or "test" in parent.parts:
                      continue
                  rel_path = idx.relative_to(".")
                  lastmod = datetime.fromtimestamp(idx.stat().st_mtime).strftime("%Y-%m-%d")
                  articles.append((str(rel_path.parent.as_posix()) + "/", lastmod))
              return articles

          lines = [
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">',
              '  <!-- ========== 站点地图 (自动生成) ========== -->'
          ]

          static_pages = [
              ("index.html",           "1.0", "weekly"),
              ("blog/",                "0.9", "daily"),
              ("aboutme.html",         "0.7", "yearly"),
              ("adss.html",            "0.6", "yearly"),
              ("privacy.html",         "0.5", "yearly"),
              ("help.html",            "0.5", "yearly"),
              ("status.html",          "0.6", "monthly"),
              ("wiki/index.html",      "0.8", "weekly"),
          ]
          for path, priority, freq in static_pages:
              lines.extend([
                  '  <url>',
                  f'    <loc>{SITE_URL}/{encode_url_path(path)}</loc>',
                  f'    <lastmod>{datetime.now().strftime("%Y-%m-%d")}</lastmod>',
                  f'    <changefreq>{freq}</changefreq>',
                  f'    <priority>{priority}</priority>',
                  '  </url>',
              ])

          game_pages = [
              ("bjqy/index.html",     "0.6", "monthly"),
              ("fors/index.html",     "0.6", "monthly"),
              ("LAIDB/index.html",    "0.6", "monthly"),
              ("zmdspp/indexzm.html", "0.6", "monthly"),
              ("91/index.html",       "0.6", "monthly"),
              ("dkdfj/index.html",    "0.6", "monthly"),
          ]
          for path, priority, freq in game_pages:
              lines.extend([
                  '  <url>',
                  f'    <loc>{SITE_URL}/{encode_url_path(path)}</loc>',
                  f'    <lastmod>{datetime.now().strftime("%Y-%m-%d")}</lastmod>',
                  f'    <changefreq>{freq}</changefreq>',
                  f'    <priority>{priority}</priority>',
                  '  </url>',
              ])

          articles = find_articles("blog")
          if articles:
              print(f"📝 发现 {len(articles)} 篇博客文章")
              for art_path, lastmod in articles:
                  lines.extend([
                      '  <url>',
                      f'    <loc>{SITE_URL}/{encode_url_path(art_path)}</loc>',
                      f'    <lastmod>{lastmod}</lastmod>',
                      '    <changefreq>monthly</changefreq>',
                      '    <priority>0.6</priority>',
                      '  </url>',
                  ])

          lines.append('</urlset>')
          sitemap = '\n'.join(lines)

          with open("sitemap.xml", "w", encoding="utf-8") as f:
              f.write(sitemap)

          print("✅ sitemap.xml 生成完成！")
          PYEOF
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
