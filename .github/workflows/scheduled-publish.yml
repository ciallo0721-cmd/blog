name: 定时发布文章

on:
  schedule:
    # 每30分钟检查一次（北京时间 00:30, 01:00, 01:30 ...）
    - cron: '30 * * * *'
  # 允许手动触发
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-scheduled:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 检查定时发布队列
        id: check
        run: |
          python admin.py --check-schedule
          
          # 检查是否生成了新的 commit
          if git diff --quiet HEAD --stat; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "📭 没有需要发布的文章"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "📝 有新文章已发布，准备提交推送"
          fi

      - name: 提交并推送发布的文章
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "🤖 定时发布文章 - $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')"
          git push
          echo "✅ 定时文章已发布并推送"

      - name: 触发动态数据更新
        if: steps.check.outputs.has_changes == 'true'
        run: |
          echo "🔄 触发伪动态数据更新工作流..."
          # 通过创建空 commit 间接触发 dynamic-update
          # 或使用 GitHub API 触发（需要 token）
          echo "动态数据将在下次定时运行时自动更新"
