<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Desktop</title>
<style>
/* ============================
   CSS 变量 & 全局 (保持原风格)
   ============================ */
:root {
  --win98-grey: #c0c0c0;
  --win98-dark: #808080;
  --win98-darker: #404040;
  --win98-light: #ffffff;
  --arg-green: #00cc00;
  --arg-darkgreen: #003300;
  --arg-red: #cc0000;
  --arg-bg: #0a0a0a;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  width:100vw; height:100vh; overflow:hidden;
  font-family: "Courier New", "NSimSun", "SimSun", monospace;
  background:#1a1a1a;
}

#desktop {
  width:100vw; height:calc(100vh - 32px);
  background:#008080;
  background-image:
    repeating-linear-gradient(0deg,   rgba(0,0,0,0.05) 0px, transparent 1px, transparent 3px),
    repeating-linear-gradient(90deg,  rgba(0,0,0,0.05) 0px, transparent 1px, transparent 3px);
  position:relative; overflow:hidden;
  cursor:default;
}

.desk-icon {
  position:absolute; width:72px;
  display:flex; flex-direction:column; align-items:center;
  padding:4px 2px; cursor:pointer; border:1px solid transparent;
  border-radius:0; transition: background 0.1s;
}
.desk-icon:hover {
  background:rgba(0,0,128,0.25);
  border:1px dotted rgba(255,255,255,0.6);
}
.desk-icon:active { background:rgba(0,0,128,0.45); }
.desk-icon .ico { font-size:30px; margin-bottom:3px; pointer-events:none; }
.desk-icon .lbl {
  color:#fff; font-size:11px; text-align:center;
  text-shadow:1px 1px 1px rgba(0,0,0,0.9);
  line-height:1.3; word-break:break-all; pointer-events:none;
}

#taskbar {
  position:fixed; bottom:0; left:0; right:0; height:32px;
  background:linear-gradient(180deg, #245edb 0%, #3f8cf3 4%, #245edb 6%, #245edb 92%, #1941a5 100%);
  border-top:2px solid #5a9cf3; border-bottom:1px solid #0a1e5a;
  display:flex; align-items:center; z-index:99999;
}
#start-btn {
  height:28px; margin:2px 3px; padding:0 10px 0 6px;
  background:linear-gradient(180deg, #3c8f3c 0%, #2d7b2d 50%, #1e5f1e 100%);
  border-top:2px solid #5cb85c; border-left:2px solid #5cb85c;
  border-right:2px solid #1a4a1a; border-bottom:2px solid #1a4a1a;
  color:#fff; font-weight:bold; font-size:11px; cursor:pointer;
  display:flex; align-items:center; gap:5px;
  font-family:"Courier New", monospace; line-height:1;
}
#start-btn:active { border-style:inset; }
#start-btn .start-ico { font-size:15px; }
#taskbar-slots {
  flex:1; display:flex; align-items:center; gap:2px; padding:0 4px;
  overflow:hidden;
}
.tbar-item {
  height:26px; max-width:160px; flex-shrink:1; min-width:40px;
  padding:0 10px; background:linear-gradient(180deg, #3b5ce8 0%, #2b4cd4 100%);
  border-top:1px solid rgba(255,255,255,0.3); border-left:1px solid rgba(255,255,255,0.3);
  border-right:1px solid rgba(0,0,0,0.3); border-bottom:1px solid rgba(0,0,0,0.3);
  color:#fff; font-size:11px; cursor:pointer;
  display:flex; align-items:center; white-space:nowrap; overflow:hidden;
  text-overflow:ellipsis; font-family:"Courier New", monospace;
}
.tbar-item.active { background:linear-gradient(180deg, #1c4ab8 0%, #1a3f9e 100%); border-style:inset; }
#clock {
  margin-left:auto; color:#fff; font-size:11px;
  padding:0 12px; height:100%; display:flex; align-items:center;
  border-left:1px solid rgba(255,255,255,0.2);
  text-shadow:1px 1px 1px rgba(0,0,0,0.5);
  font-family:"Courier New", monospace;
}

.win {
  position:absolute; display:flex; flex-direction:column;
  background:var(--win98-grey); min-width:180px; min-height:100px;
  border-top:2px solid var(--win98-light);
  border-left:2px solid var(--win98-light);
  border-right:2px solid var(--win98-darker);
  border-bottom:2px solid var(--win98-darker);
  box-shadow:1px 1px 0 #000;
}
.win-titlebar {
  height:22px; flex-shrink:0;
  background:linear-gradient(90deg, #000080, #1084d0);
  color:#fff; font-size:11px; font-weight:bold;
  display:flex; align-items:center; justify-content:space-between;
  padding:1px 3px; cursor:grab; user-select:none;
}
.win-titlebar.inactive { background:linear-gradient(90deg, #808080, #b0b0b0); }
.win-titlebar .win-title { display:flex; align-items:center; gap:4px; overflow:hidden; }
.win-btns { display:flex; gap:2px; flex-shrink:0; }
.win-btn {
  width:16px; height:14px;
  background:var(--win98-grey);
  border-top:2px solid var(--win98-light); border-left:2px solid var(--win98-light);
  border-right:2px solid var(--win98-darker); border-bottom:2px solid var(--win98-darker);
  display:flex; align-items:center; justify-content:center;
  font-size:9px; cursor:pointer; padding:0; line-height:1;
}
.win-btn:active { border-style:inset; }
.win-body { flex:1; margin:3px; display:flex; flex-direction:column; overflow:hidden; }

.browser-toolbar {
  display:flex; align-items:center; gap:4px;
  padding:3px; background:var(--win98-grey);
  border-bottom:1px solid var(--win98-dark); flex-shrink:0;
}
.browser-toolbar button {
  font-family:"Courier New", monospace; font-size:11px;
  padding:1px 7px; cursor:pointer;
  background:var(--win98-grey);
  border-top:2px solid var(--win98-light); border-left:2px solid var(--win98-light);
  border-right:2px solid var(--win98-darker); border-bottom:2px solid var(--win98-darker);
}
.browser-toolbar button:active { border-style:inset; }
.browser-toolbar button:disabled { color:#808080; }
.addr-bar {
  flex:1; display:flex; align-items:center;
  border:2px inset var(--win98-grey); background:#fff;
  padding:1px 4px; height:20px; font-size:12px;
  font-family:"Courier New", monospace; color:#000; overflow:hidden;
}
.addr-bar .addr-tag { color:#0000aa; margin-right:3px; font-size:11px; }
.browser-content {
  flex:1; background:var(--arg-bg); overflow-y:auto; overflow-x:hidden;
  padding:14px; color:var(--arg-green); font-family:"Courier New", monospace;
  font-size:13.5px; line-height:1.7; position:relative;
}
.browser-statusbar {
  height:20px; background:var(--win98-grey);
  border-top:1px solid var(--win98-dark); flex-shrink:0;
  display:flex; align-items:center; padding:0 5px;
  font-size:11px; color:#000; font-family:"Courier New", monospace;
}

.term-screen {
  background:#000; color:var(--arg-green);
  font-family:"Courier New", monospace; font-size:13.5px;
  padding:8px; flex:1; overflow-y:auto; white-space:pre-wrap; word-break:break-all;
  line-height:1.5;
}
.term-input-line {
  display:flex; align-items:center;
  background:#000; color:var(--arg-green);
  font-family:"Courier New", monospace; font-size:13.5px;
  padding:0 8px 8px;
}
.term-input-line .prompt { color:var(--arg-green); margin-right:4px; white-space:nowrap; }
.term-input-line input {
  flex:1; background:transparent; border:none; outline:none;
  color:var(--arg-green); font-family:"Courier New", monospace; font-size:13.5px;
  caret-color:var(--arg-green);
}

.typing { border-right:2px solid var(--arg-green); animation:caret-blink 0.7s step-end infinite; }
@keyframes caret-blink { 0%,100%{border-color:var(--arg-green)} 50%{border-color:transparent} }

@keyframes flicker {
  0%,18%,21%,23%,25%,53%,57%,100% { opacity:1; }
  19%,22%,24%,55%,56% { opacity:0.08; }
}
.flicker { animation:flicker 2.5s infinite; }

@keyframes glitch-h {
  0%   { transform:translate(0,0); }
  20%  { transform:translate(-3px, 1px); }
  40%  { transform:translate(2px,-2px); }
  60%  { transform:translate(-1px, 2px); }
  80%  { transform:translate(3px,-1px); }
  100% { transform:translate(0,0); }
}
.glitch-h { animation:glitch-h 0.3s steps(2) infinite; }

.red-flash-layer {
  position:fixed; top:0; left:0; right:0; bottom:0;
  background:rgba(120,0,0,0.18); pointer-events:none; z-index:99990;
  animation:flicker 0.6s infinite;
}

.forum-post {
  border:1px solid #005500; margin:10px 0; padding:10px;
  background:rgba(0,20,0,0.7);
}
.forum-author { color:#00aaff; font-size:12px; margin-bottom:5px; }
.forum-title { color:#ffff40; font-size:15px; font-weight:bold; margin:6px 0; }
.forum-body { color:#00dd00; font-size:13px; line-height:1.7; }
.forum-meta { color:#008800; font-size:11px; margin-top:6px; }

.reply-section {
  border:1px solid #004400; margin-top:12px; padding:8px;
  background:rgba(0,15,0,0.6);
}
.reply-section textarea {
  width:100%; height:56px; background:#000; color:var(--arg-green);
  border:1px solid #005500; font-family:"Courier New",monospace;
  font-size:12.5px; padding:4px; resize:none;
}
.reply-section button {
  margin-top:5px; padding:4px 14px; background:#002200;
  color:var(--arg-green); border:1px solid #008800; cursor:pointer;
  font-family:"Courier New",monospace; font-size:12px;
}
.reply-section button:hover { background:#004400; }

.ascii-art {
  color:#00aa00; font-size:10.5px; line-height:1.05;
  white-space:pre; font-family:"Courier New",monospace;
  text-align:center; margin:14px 0; letter-spacing:0;
}

.wb-header {
  color:#00cc00; font-size:17px; font-weight:bold;
  text-align:center; margin-bottom:10px;
  text-shadow:0 0 6px rgba(0,204,0,0.4);
}
.wb-search {
  display:flex; gap:4px; margin:8px 0;
}
.wb-search input {
  flex:1; background:#000; color:var(--arg-green); border:1px solid #005500;
  font-family:"Courier New",monospace; font-size:13px; padding:4px 6px;
}
.wb-timeline {
  display:flex; gap:6px; padding:8px; overflow-x:auto;
  border:1px solid #004400; background:rgba(0,15,0,0.5); margin:8px 0;
}
.wb-snapshot {
  min-width:76px; padding:7px; border:1px solid #005500;
  background:rgba(0,30,0,0.7); color:var(--arg-green);
  text-align:center; cursor:pointer; font-size:12px; flex-shrink:0;
}
.wb-snapshot:hover { background:rgba(0,60,0,0.8); }

.arg-btn {
  display:inline-block; padding:9px 22px; margin:6px 0;
  background:rgba(0,20,0,0.8); color:var(--arg-green);
  border:2px solid #008800; cursor:pointer;
  font-family:"Courier New",monospace; font-size:13.5px;
  text-align:center; transition:background 0.15s;
}
.arg-btn:hover { background:rgba(0,50,0,0.9); }
.arg-btn:active { border-style:inset; }

.warn-page { text-align:center; padding:20px 10px; }
.warn-icon { font-size:46px; margin-bottom:10px; }
.warn-line { color:#ffaa00; font-size:15px; margin:7px 0; line-height:1.7; }
.warn-notice { color:#ff4444; font-size:12.5px; margin:7px 0; }

.final-page {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:100%; min-height:300px;
}
.final-line {
  color:#ff0000; font-size:19px; text-align:center;
  animation:final-fade 2.5s ease-in-out infinite;
}
@keyframes final-fade { 0%,100%{opacity:0} 50%{opacity:1} }
.final-sub { color:#ff4444; font-size:13px; margin-top:14px; animation:final-fade 3s ease-in-out infinite; }

.status-glitch {
  color:#ff0000 !important; font-weight:bold; font-size:11px !important;
  animation:flicker 0.7s infinite;
}

@keyframes bg-distort {
  0%   { filter:none; }
  25%  { filter:hue-rotate(130deg) brightness(0.6) saturate(1.5); }
  50%  { filter:invert(0.15) hue-rotate(70deg) contrast(1.4); }
  75%  { filter:sepia(0.3) hue-rotate(200deg) brightness(0.5); }
  100% { filter:none; }
}
.desk-distort { animation:bg-distort 0.6s infinite; }

.float-eye {
  position:fixed; color:#cc0000; font-family:"Courier New",monospace;
  pointer-events:none; z-index:99991; opacity:0.85;
  animation:float-up linear forwards;
}
@keyframes float-up {
  0%   { transform:translateY(0) rotate(0deg); opacity:0; }
  8%   { opacity:0.85; }
  85%  { opacity:0.85; }
  100% { transform:translateY(-105vh) rotate(400deg); opacity:0; }
}

.browser-content::-webkit-scrollbar { width:8px; }
.browser-content::-webkit-scrollbar-track { background:#001100; }
.browser-content::-webkit-scrollbar-thumb { background:#005500; border-radius:0; }

.mc-content { padding:14px; color:#000; font-size:13px; background:var(--win98-grey); flex:1; overflow:auto; }
.mc-icon {
  display:inline-flex; flex-direction:column; align-items:center;
  width:68px; margin:6px; cursor:pointer; text-align:center; font-size:11px;
  padding:3px; border:1px solid transparent;
}
.mc-icon:hover { background:rgba(0,0,128,0.15); border:1px dotted rgba(0,0,128,0.4); }

.bg-black { background:#000 !important; }
.hidden { display:none !important; }

<script>
// =============================================================
// 全局状态
// =============================================================
const state = {
  playerName: '',
  phase: 'desktop',
  browserHist: [],
  browserUrl: 'about:blank',
  termClose: 0,
  audioCtx: null,
  ending: false,
  statusIv: null,
  endingIvs: [],
  oscillator: null,
};

function $(id) { return document.getElementById(id); }
function randInt(a,b) { return Math.floor(Math.random()*(b-a+1))+a; }
function randChar() {
  const s='!@#$%^&*()_+-=[]{}|;:<>?/~`abcdefghijklmnopqrstuvwxyz0123456789';
  return s[randInt(0,s.length-1)];
}
function garbage(n) { let s=''; for(let i=0;i<n;i++) s+=randChar(); return s; }

// 时钟
function updateClock() {
  const d=new Date(), h=String(d.getHours()).padStart(2,'0'), m=String(d.getMinutes()).padStart(2,'0');
  $('clock').textContent = h+':'+m;
}
updateClock();
setInterval(updateClock, 1000);

// 开始菜单
function toggleStart() { $('start-menu').classList.toggle('hidden'); }
function closeStart() { $('start-menu').classList.add('hidden'); }
document.addEventListener('click', (e) => {
  if (!e.target.closest('#start-btn') && !e.target.closest('#start-menu')) closeStart();
});

// 窗口管理
const WIN_ORDER = ['browser','terminal','mycomputer','recycle'];
let zSeed = 100;

function deskIconClick(type) {
  closeStart();
  openWin(type);
}

function openWin(type) {
  const w = $('win-'+type);
  if (!w) return;
  w.classList.remove('hidden');
  bringFront(w);
  updTbar();
  if (type==='browser' && state.phase==='desktop') {
    state.phase = 'warning';
    browserGo('index', renderWarning);
  }
  if (type==='terminal') focusTerm();
}

function winClose(type) {
  const w = $('win-'+type);
  if (w) w.classList.add('hidden');
  updTbar();
  if (type==='terminal' && state.phase==='terminal-ending') {
    state.termClose++;
    if (state.termClose >= 3) {
      state.termClose = 0;
      clearEnding();
      openWin('browser');
      state.phase = 'final';
      browserGo('9cc://awakening', renderFinal);
    } else {
      const left = 3 - state.termClose;
      appendTerm('\n[系统] 传输中断中……还需关闭终端 ' + left + ' 次。\n');
    }
  }
}

function winMin(type) {
  const w = $('win-'+type);
  if (w) w.classList.add('hidden');
  updTbar();
}

function bringFront(w) {
  document.querySelectorAll('.win').forEach(x=>{
    x.classList.remove('active');
    x.querySelector('.win-titlebar').classList.add('inactive');
  });
  w.classList.add('active');
  w.querySelector('.win-titlebar').classList.remove('inactive');
  zSeed++;
  w.style.zIndex = zSeed;
}

function updTbar() {
  const slot = $('taskbar-slots');
  slot.innerHTML = '';
  WIN_ORDER.forEach(t=>{
    const w = $('win-'+t);
    if (w && !w.classList.contains('hidden')) {
      const btn = document.createElement('button');
      btn.className = 'tbar-item' + (w.classList.contains('active')?' active':'');
      const labels = {browser:'网络浏览器',terminal:'命令提示符'};
      btn.textContent = labels[t];

// 窗口拖动
(function initDrag(){
  let g=null, ox=0, oy=0;
  document.addEventListener('mousedown', (e)=>{
    const tb = e.target.closest('.win-titlebar');
    if (!tb) return;
    g = tb.closest('.win');
    const r = g.getBoundingClientRect();
    ox = e.clientX - r.left;
    oy = e.clientY - r.top;
    g.style.opacity = '0.85';
    bringFront(g);
  });
  document.addEventListener('mousemove', (e)=>{
    if (!g) return;
    let nx = e.clientX - ox, ny = e.clientY - oy;
    nx = Math.max(0, Math.min(window.innerWidth-120, nx));
    ny = Math.max(0, Math.min(window.innerHeight-70, ny));
    g.style.left = nx+'px';
    g.style.top  = ny+'px';
  });
  document.addEventListener('mouseup', ()=>{ if(g){ g.style.opacity=''; g=null; } });
})();

// 打字机效果
function typewrite(el, text, speed, cb) {
  speed = speed || 38;
  el.textContent = '';
  el.classList.add('typing');
  let i=0;
  const iv = setInterval(()=>{
    if (i < text.length) {
      el.textContent += text[i];
      i++;
      const bc = $('browser-content');
      if (bc) bc.scrollTop = bc.scrollHeight;
    } else {
      clearInterval(iv);
      el.classList.remove('typing');
      if (cb) cb();
    }
  }, speed);
  return ()=>clearInterval(iv);
}

function playReverseAudio() {
  // 模拟倒放音效 (Web Audio 锯齿波倒置效果)
  try {
    if (!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
    const now = state.audioCtx.currentTime;
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 880;
    gain.gain.value = 0.05;
    osc.connect(gain);
    gain.connect(state.audioCtx.destination);
    osc.start();
    // 频率从高到低扫频 (模拟倒放)
    osc.frequency.exponentialRampToValue(220, now + 2.5);
    gain.gain.exponentialRampToValue(0.0001, now + 2.8);
    setTimeout(() => { try { osc.stop(); } catch(e){} }, 3000);
    appendTerm('\n[系统] 录音片段已播放: "他们来了..."\n');
  } catch(e) {}
}

    appendTerm('\n');
    appendTerm('   3 个文件         18,432 字节\n');
    appendTerm('   2 个目录    5,242,880,000 字节可用\n\n');
  }
  else if (lc==='type') {
    appendTerm('  type 命令需要指定文件名。\n');
    appendTerm('  用法：type &lt;filename&gt;\n');
    appendTerm('  提示：the_truth.txt 已加密，需要密码。\n');
    appendTerm('  密码格式：&lt;你名字的字符数&gt;_9\n\n');
    if (state.playerName) {
      appendTerm('  （你的名字是 "' + state.playerName + '"，共 ' + state.playerName.length + ' 个字符……）\n\n');
    }
  }
  else if (lc.startsWith('type ')) {
    const fname = cmd.slice(5).trim();
    if (fname==='the_truth.txt' || fname==='the_truth' || fname==='truth') {
      appendTerm('  [the_truth.txt] 文件已加密。\n');
      appendTerm('  请输入密码来解密。\n');
      appendTerm('  &gt; ');
      appendTerm('\n  （提示：直接在提示符后输入密码并回车。）\n\n');
    } else {
      appendTerm('  type: ' + fname + ': 没有此文件\n\n');
    }
  }
  else if (lc==='cls') {
    $('term-output').textContent = '';
  }
  else if (lc==='exit') {
    appendTerm('  会话无法终止。\n');
    appendTerm('  第九频道仍在监听……\n\n');
  }
  else if (lc==='frequency' || lc==='freq') {
    appendTerm('  ........\n');
    appendTerm('  ████████████████████ 100%\n\n');
    playBeep();
  }
  else if (lc==='signal') {
    appendTerm('  -.... ..--- -.-. -.-.\n');
    playMorse();
  }
  else {
    appendTerm('  "' + cmd + '" 不是内部或外部命令，也不是可运行的程序。\n');
    appendTerm('  输入 "help" 查看可用命令。\n\n');
  }
}

function playMorse() {
  try {
    if (!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (state.audioCtx.state === 'suspended') state.audioCtx.resume();
    const pattern = [0.2, 0.2, 0.2, 0.6, 0.2, 0.2, 0.2]; // 简化的 9 C C
    let time = state.audioCtx.currentTime;
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.value = 0;
    osc.connect(gain);
    gain.connect(state.audioCtx.destination);
    osc.start();
    for (let i=0; i<pattern.length; i++) {
      const dur = pattern[i];
      gain.gain.setValueAtTime(0.08, time);
      gain.gain.setValueAtTime(0.08, time + dur - 0.02);
      gain.gain.setValueAtTime(0, time + dur);
      time += dur + 0.05;
    }
    setTimeout(() => { try { osc.stop(); } catch(e){} }, time * 1000 + 500);
  } catch(e) {}
}

function playBeep() {
  try {
    if (!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (state.audioCtx.state==='suspended') state.audioCtx.resume();
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 9.9;
    gain.gain.value = 0.08;
    osc.connect(gain);
    gain.connect(state.audioCtx.destination);
    osc.start();
    setTimeout(()=>{ try{osc.stop();}catch(e){} }, 3000);
  } catch(e) {}
}

// 终局
function triggerEnding() {
  if (state.ending) return;
  state.ending = true;
  state.phase = 'terminal-ending';
  const o = $('term-output');
  o.textContent = '';
  const lines = [
    '正在验证密码……',
    '',
    '✔ 密码正确。',
    '✔ 正在解密 the_truth.txt……',
    '',
    '━━━━━━━━━━━━━━━━━━━━━━━━━━━━',
    '',
    '第九频道并未消失。',
    '它仍在招募。',
    '',
    '你已被选为下一个接收者。',
    '',
    '关闭此终端三次可中断传输。',
    '',
    '正在建立永久连接……',
    '信号频率：9.9 Hz',
    '',
    '受试者 #' + (state.playerName.length) + ' 已确认。',
    '',
    '████████████████████████████████',
    '',
    '勿忘频率。',
    '勿忘第九频道。',
    '',
    '他们正在来的路上。',
    '',
  ];
  let li = 0;
  function printLine() {
    if (li < lines.length) {
      appendTerm(lines[li] + '\n');
      li++;
      setTimeout(printLine, 250 + Math.random()*350);
    } else {
      startEndingEffects();
    }
  }
  printLine();
}

function startEndingEffects() {
  const desk = $('desktop');
  desk.classList.add('desk-distort');
  $('red-flash').classList.remove('hidden');
  $('ico-mycomp').textContent = '⛧';
  $('lbl-mycomp').textContent = '第九频道';
  const floatMsgs = ['👁️','◎','⛧','9','加入我们','9CC','███','受试者'];
  function spawnEye() {
    if (!state.ending) return;
    const el = document.createElement('div');
    el.className = 'float-eye';
    el.textContent = floatMsgs[randInt(0, floatMsgs.length-1)];
    el.style.left = randInt(2,96)+'%';
    el.style.fontSize = (13+randInt(0,18))+'px';
    const dur = 3.5 + Math.random()*4;
    el.style.animationDuration = dur+'s';
    desk.appendChild(el);
    setTimeout(()=>el.remove(), dur*1000+200);
  }
  for (let i=0;i<6;i++) setTimeout(spawnEye, i*400);
  const iv1 = setInterval(spawnEye, 1100);
  state.endingIvs.push(iv1);
  startBeep();
  if (!$('win-browser').classList.contains('hidden')) {
    const bc = $('browser-content');
    const intruder = document.createElement('div');
    intruder.style.cssText='color:#ff0000; font-size:13px; margin-top:12px; font-weight:bold;';
    intruder.textContent='[警告] 检测到未授权访问。第九频道正在定位你的位置……';
    bc.appendChild(intruder);
  }
}

function startBeep() {
  try {
    if (!state.audioCtx) state.audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if (state.audioCtx.state==='suspended') state.audioCtx.resume();
    const osc = state.audioCtx.createOscillator();
    const gain = state.audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 440;
    gain.gain.value = 0.06;
    osc.connect(gain);
    gain.connect(state.audioCtx.destination);
    osc.start();
    state.oscillator = osc;
    const iv2 = setInterval(()=>{
      if (!state.ending) { clearInterval(iv2); return; }
      osc.frequency.value = 440 + Math.sin(Date.now()/1000)*25;
      gain.gain.value = 0.04 + Math.sin(Date.now()/800)*0.025;
    }, 100);
    state.endingIvs.push(iv2);
  } catch(e) {}
}

function clearEnding() {
  state.ending = false;
  state.endingIvs.forEach(iv=>clearInterval(iv));
  state.endingIvs = [];
  if (state.oscillator) { try{state.oscillator.stop();}catch(e){} state.oscillator=null; }
  $('red-flash').classList.add('hidden');
  $('desktop').classList.remove('desk-distort');
  // $('ico-mycomp').textContent = '💻';
  // $('lbl-mycomp').textContent = '我的电脑';
  document.querySelectorAll('.float-eye').forEach(el=>el.remove());
  stopStatusGlitch();
}

  setTimeout(()=>{ btn.style.transition='opacity 2s'; btn.style.opacity='1'; btnAfter.style.transition='opacity 2s'; btnAfter.style.opacity='1'; }, 5500);
}

// 重置
function resetAll() {
  clearEnding();
  stopStatusGlitch();
  state.playerName = '';
  state.phase = 'desktop';
  state.browserHist = [];
  state.browserUrl = 'about:blank';
  state.termClose = 0;
  $('term-output').textContent = '';
  $('term-input').value = '';
  $('browser-url').textContent = 'about:blank';
  $('browser-content').innerHTML = '';
  $('browser-content').classList.remove('bg-black');
  $('browser-status').textContent = '就绪';
  $('browser-status').className = '';
  ['browser','terminal','mycomputer','recycle'].forEach(t=>{
    $('win-'+t).classList.add('hidden');
  });
  updTbar();
}

document.addEventListener('DOMContentLoaded', ()=>{

});
