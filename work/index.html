<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>打工模拟器 - Web版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      font-family: 'Consolas', 'Courier New', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .terminal-container {
      width: 100%;
      max-width: 880px;
      height: 90vh;
      max-height: 720px;
      background: #0d0d1a;
      border: 2px solid #2a2a4a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.08);
      overflow: hidden;
    }
    .terminal-header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .terminal-dots {
      display: flex;
      gap: 7px;
    }
    .terminal-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
    }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    .terminal-title {
      color: #8899bb;
      font-size: 13px;
      margin-left: 8px;
      flex: 1;
      letter-spacing: 1px;
    }
    .terminal-badge {
      background: #e94560;
      color: #fff;
      font-size: 11px;
      padding: 2px 10px;
      border-radius: 10px;
      font-family: 'Consolas', monospace;
    }
    .terminal-output {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      font-size: 14px;
      line-height: 1.6;
      color: #e0e0e0;
      white-space: pre-wrap;
      word-wrap: break-word;
      background: #0d0d1a;
      scroll-behavior: smooth;
    }
    .terminal-output::-webkit-scrollbar { width: 6px; }
    .terminal-output::-webkit-scrollbar-track { background: #0d0d1a; }
    .terminal-output::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
    .terminal-input-area {
      display: flex;
      align-items: center;
      gap: 0;
      padding: 8px 18px 10px;
      background: #12122a;
      border-top: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .terminal-prompt {
      color: #27c93f;
      font-size: 14px;
      margin-right: 8px;
      user-select: none;
    }
    .terminal-input {
      flex: 1;
      background: #1a1a3a;
      border: 1px solid #2a2a5a;
      border-radius: 6px;
      padding: 7px 12px;
      color: #e0e0e0;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .terminal-input:focus {
      border-color: #e94560;
      box-shadow: 0 0 8px rgba(233, 69, 96, 0.2);
    }
    .terminal-input::placeholder { color: #555; }
    .btn-send {
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 7px 16px;
      margin-left: 8px;
      font-family: 'Consolas', monospace;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-send:hover { background: #c73650; }
    .btn-send:active { background: #a02a40; }
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s;
    }
    .loading-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .loading-text {
      color: #e94560;
      font-size: 20px;
      margin-bottom: 20px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    .loading-spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a2a4a;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
    .file-warning {
      background: #2a1a1a;
      border: 1px solid #e94560;
      border-radius: 8px;
      padding: 16px 20px;
      margin: 16px;
      max-width: 600px;
      color: #ff9999;
      font-size: 14px;
      line-height: 1.8;
    }
    .file-warning code {
      background: #1a1a1a;
      padding: 2px 8px;
      border-radius: 4px;
      color: #ffbd2e;
      font-family: 'Consolas', monospace;
    }
    .file-warning .cmd {
      display: block;
      background: #1a1a1a;
      padding: 10px 14px;
      margin: 8px 0;
      border-radius: 6px;
      color: #27c93f;
      font-family: 'Consolas', monospace;
      font-size: 13px;
    }

    /* ANSI color styles */
    .ansi-reset { color: #e0e0e0; }
    .ansi-red { color: #ff6b6b; }
    .ansi-green { color: #51cf66; }
    .ansi-yellow { color: #ffd43b; }
    .ansi-blue { color: #5c7cfa; }
    .ansi-magenta { color: #da77f2; }
    .ansi-cyan { color: #3bc9db; }
    .ansi-white { color: #e0e0e0; }
    .ansi-bold { font-weight: bold; }
  </style>
</head>
<body>

  <div id="fileWarning" class="file-warning" style="display:none;">
    ⚠️ 检测到你直接用浏览器打开了 HTML 文件（<code>file://</code> 协议）。
    现代浏览器禁止从本地文件加载 WASM，请改用 HTTP 服务器运行：
    <span class="cmd">cd "G:\EmoScan Pro\Work-Simulator\源码"<br>python -m http.server 8000</span>
    然后浏览器打开 <code style="color:#3bc9db;">http://localhost:8000/打工模拟器.html</code>
  </div>

  <div class="terminal-container" id="terminal">
    <div class="terminal-header">
      <div class="terminal-dots">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow"></div>
        <div class="terminal-dot dot-green"></div>
      </div>
      <span class="terminal-title">🐱 打工模拟器 — Web 终端版</span>
      <span class="terminal-badge">WASM</span>
    </div>

    <div class="terminal-output" id="output">
      <span style="color:#555;">正在加载游戏引擎...</span>
    </div>

    <div class="terminal-input-area">
      <span class="terminal-prompt">❯</span>
      <input class="terminal-input" id="inputField" type="text" placeholder="在这里输入... 按 Enter 发送" autofocus disabled>
      <button class="btn-send" id="sendBtn" disabled>发送</button>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-text" id="statusText">加载中...</div>
    <div class="loading-spinner"></div>
  </div>

  <script>
    // ============================================================
    //  DOM 引用
    // ============================================================
    var outputEl  = document.getElementById('output');
    var inputEl   = document.getElementById('inputField');
    var sendBtn   = document.getElementById('sendBtn');
    var statusEl  = document.getElementById('statusText');
    var overlayEl = document.getElementById('loadingOverlay');
    var warnEl    = document.getElementById('fileWarning');
    var termEl    = document.getElementById('terminal');

    // ============================================================
    //  file:// 检测
    // ============================================================
    var isFileProtocol = window.location.protocol === 'file:';
    if (isFileProtocol) {
      warnEl.style.display = 'block';
      termEl.style.display = 'none';
    }

    // ============================================================
    //  ANSI → HTML 转换
    // ============================================================
    var ansiMap = {
      '0;30':  'ansi-reset', '30': 'ansi-reset',
      '0;31':  'ansi-red',   '31': 'ansi-red',
      '0;32':  'ansi-green', '32': 'ansi-green',
      '0;33':  'ansi-yellow','33': 'ansi-yellow',
      '0;34':  'ansi-blue',  '34': 'ansi-blue',
      '0;35':  'ansi-magenta','35': 'ansi-magenta',
      '0;36':  'ansi-cyan',  '36': 'ansi-cyan',
      '0;37':  'ansi-white', '37': 'ansi-white',
      '0':     'ansi-reset',
      '1':     'ansi-bold',
      '1;31':  'ansi-red ansi-bold',
      '1;32':  'ansi-green ansi-bold',
      '1;33':  'ansi-yellow ansi-bold',
      '1;34':  'ansi-blue ansi-bold',
      '1;35':  'ansi-magenta ansi-bold',
      '1;36':  'ansi-cyan ansi-bold',
      '1;37':  'ansi-white ansi-bold',
    };

    // 是否处于"屏幕已清除"状态（用于把 CLS 换成分隔线）
    var _lastWasClear = false;

    function ansiToHtml(text) {
      // 转义 HTML（防 XSS）
      text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      // ESC[2J 或 ESC[H 或 ESC[2J ESC[H → 替换为分隔线（清屏视觉效果）
      text = text.replace(/(\x1b\[2J)?(\x1b\[H|\x1b\[0;0H|\x1b\[1;1H)/g, function() {
        return '\n\x1b[dim]─────────────────────────────────────────\x1b[/]\n';
      });
      text = text.replace(/\x1b\[2J/g, '');
      // 移除其他光标控制序列
      text = text.replace(/\x1b\[\d*(?:[ABCDEFGKST])/g, '');
      text = text.replace(/\x1b\[\d*;\d*[Hf]/g, '');
      // 替换 ANSI 颜色/样式转义序列
      text = text.replace(/\x1b\[([\d;]*)m/g, function(match, code) {
        if (code === '' || code === '0') return '</span><span class="ansi-reset">';
        var cls = ansiMap[code];
        if (cls) return '</span><span class="' + cls + '">';
        return '';
      });
      // 清理刚才加的临时标记
      text = text.replace(/\x1b\[dim\]/g, '<span style="color:#333;user-select:none;">');
      text = text.replace(/\x1b\[\/\]/g, '</span>');
      return text;
    }

    // 输出纯文本（自动处理 ANSI→HTML 转换）
    var _firstOutput = true;
    function writeOutput(text) {
      var html = ansiToHtml(text);
      if (_firstOutput) {
        outputEl.innerHTML = html;
        _firstOutput = false;
      } else {
        outputEl.innerHTML += html;
      }
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    // 输出预格式化 HTML（不转义，用于提示/错误/UI 装饰）
    function writeHtml(html) {
      if (_firstOutput) {
        outputEl.innerHTML = html;
        _firstOutput = false;
      } else {
        outputEl.innerHTML += html;
      }
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    // ============================================================
    //  输入队列系统 — 三层输入，永不弹窗！
    //  __inputQueue 是全局暴露的，供 patch 后的 打工模拟器.js 读取
    // ============================================================
    var inputQueue = [];
    window.__inputQueue = inputQueue;  // 暴露给 JS 胶水代码中的 FS_stdin_getChar 使用

    // 推送一行文本到队列（末尾自动加 \n）
    function queueLine(text) {
      for (var i = 0; i < text.length; i++) {
        inputQueue.push(text.charCodeAt(i));
      }
      inputQueue.push('\n'.charCodeAt(0));
    }

    // 推送单个字符到队列
    function queueChar(c) {
      inputQueue.push(c.charCodeAt(0));
    }

    // ============================================================
    //  Tier 1 — 全局键盘捕获（在加载动画 yield 期间也能捕获按键！）
    // ============================================================
    document.addEventListener('keydown', function(e) {
      if (document.activeElement === inputEl) return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;

      if (e.key === 'Enter') {
        queueChar('\n');
        e.preventDefault();
      } else if (e.key === 'Backspace') {
        e.preventDefault();
      } else if (e.key.length === 1) {
        queueChar(e.key);
        e.preventDefault();
      }
    });

    // ============================================================
    //  Tier 2 — 输入框提交
    // ============================================================
    function submitInput(text) {
      if (!text) text = '';
      queueLine(text);
      inputEl.value = '';
    }

    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitInput(inputEl.value);
      }
    });

    sendBtn.addEventListener('click', function() {
      submitInput(inputEl.value);
    });

    document.addEventListener('click', function() {
      if (!inputEl.disabled) inputEl.focus();
    });

    // ============================================================
    //  Tier 3 — 自定义 stdin（C++ 已加 emscripten_sleep yield 点）
    //  队列为空时返回 null（EOF），C++ 的 fgets 返回 NULL，
    //  触发 get_valid_input 里的 emscripten_sleep(100)，等待用户输入。
    // ============================================================
    function customStdin() {
      if (inputQueue.length > 0) {
        return inputQueue.shift();
      }
      // 返回 null 表示 EOF → fgets 返回 NULL → C++ sleep(100) 等用户
      return null;
    }

    // ============================================================
    //  Module 定义（给 Emscripten 用）
    // ============================================================
    var setStatus = function(text) {
      if (text) {
        statusEl.textContent = text;
      } else {
        overlayEl.classList.add('hidden');
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    };

    var Module = {
      print: function() {
        // Emscripten 的 print 每次调用对应一行（行尾不含\n），手动加换行
        var text = Array.prototype.join.call(arguments, ' ');
        writeOutput(text + '\n');
      },
      printErr: function() {
        var text = Array.prototype.join.call(arguments, ' ');
        if (text.indexOf('stdio streams had content') !== -1) return;
        if (text.indexOf('you should set EXIT_RUNTIME') !== -1) return;
        writeHtml('\n<span style="color:#ff6b6b;">[错误] ' + ansiToHtml(text) + '</span>\n');
      },
      setStatus: setStatus,

      preRun: [
        function() {
          if (typeof FS !== 'undefined') {
            FS.init(customStdin, null, null);
          }
          writeHtml('<span style="color:#555;">输入系统就绪 ✓</span>\n');
        }
      ],

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          setStatus('加载资源... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
        } else {
          setStatus('加载完成 ✓');
          setTimeout(function() {
            overlayEl.classList.add('hidden');
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
            writeHtml('<span style="color:#27c93f;">═══════ 打工模拟器 已启动 ═══════</span>\n\n');
          }, 300);
        }
      },

      canvas: (function() {
        var canvas = document.getElementById('canvas');
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.id = 'canvas';
          canvas.style.display = 'none';
          document.body.appendChild(canvas);
        }
        return canvas;
      })()
    };

    window.onerror = window.onunhandledrejection = function() {
      setStatus('发生错误，请查看控制台');
      overlayEl.classList.add('hidden');
    };

    window.Module = Module;

    // ============================================================
    //  覆盖 Emscripten 胶水代码中的 FS_stdin_getChar
    //  该函数在 打工模拟器.js 里是全局 var，所以在 JS 加载执行后
    //  直接覆盖 window.FS_stdin_getChar 即可劫持所有 stdin 读取。
    // ============================================================
    // onRuntimeInitialized — 覆盖全局 FS_stdin_getChar（双保险）
    // 打工模拟器.js 已直接 patch 去掉了 window.prompt，此处额外覆盖以防万一
    Module.onRuntimeInitialized = function() {
      if (typeof FS_stdin_getChar !== 'undefined') {
        window.FS_stdin_getChar = function() {
          if (inputQueue.length > 0) {
            return inputQueue.shift();
          }
          return null;
        };
      }
      if (typeof FS_stdin_getChar_buffer !== 'undefined') {
        FS_stdin_getChar_buffer = [];
      }
    };
  </script>

  <script async type="text/javascript" src="%E6%89%93%E5%B7%A5%E6%A8%A1%E6%8B%9F%E5%99%A8.js"></script>
  <div id="canvas" style="display:none;"></div>
</body>
</html>
