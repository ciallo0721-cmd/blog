<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>打工模拟器 - Web版</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a2e;
      font-family: 'Consolas', 'Courier New', 'Segoe UI Emoji', 'Apple Color Emoji', monospace;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .terminal-container {
      width: 100%;
      max-width: 880px;
      height: 90vh;
      max-height: 720px;
      background: #0d0d1a;
      border: 2px solid #2a2a4a;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 40px rgba(0, 200, 255, 0.08);
      overflow: hidden;
    }
    .terminal-header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 10px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #2a2a4a;
      flex-shrink: 0;
    }
    .terminal-dots { display: flex; gap: 7px; }
    .terminal-dot { width: 12px; height: 12px; border-radius: 50%; }
    .dot-red { background: #ff5f56; }
    .dot-yellow { background: #ffbd2e; }
    .dot-green { background: #27c93f; }
    .terminal-title {
      color: #8888aa;
      font-size: 13px;
      letter-spacing: 1px;
    }
    #output {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      color: #c0c0dd;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    #output::-webkit-scrollbar { width: 6px; }
    #output::-webkit-scrollbar-track { background: #0d0d1a; }
    #output::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }

    .input-area {
      display: flex;
      padding: 10px 16px;
      background: #111128;
      border-top: 1px solid #2a2a4a;
      gap: 8px;
      flex-shrink: 0;
    }
    .input-area input {
      flex: 1;
      background: #0d0d1a;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 8px 12px;
      color: #c0c0dd;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .input-area input:focus { border-color: #e94560; }
    .input-area input::placeholder { color: #555577; }
    .input-area button {
      background: #e94560;
      border: none;
      border-radius: 6px;
      padding: 8px 16px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
    .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

    .loading-overlay {
      position: absolute; inset: 0;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 0.5s;
    }
    .loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #2a2a4a;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #statusText { color: #8888aa; margin-top: 12px; font-size: 14px; }
    .file-warning {
      display: none;
      background: #2a1a1a;
      border: 2px solid #ff6b6b;
      border-radius: 12px;
      padding: 24px;
      margin: 20px;
      text-align: center;
    }
    .file-warning h2 { color: #ff6b6b; margin-bottom: 12px; }
    .file-warning p { color: #c0c0dd; line-height: 1.8; }
    .file-warning code {
      background: #1a1a2e;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
      color: #ffbd2e;
    }

    .terminal-container { position: relative; }
    #output .ansi-reset { color: #c0c0dd; }
    #output .ansi-red { color: #ff6b6b; }
    #output .ansi-green { color: #27c93f; }
    #output .ansi-yellow { color: #ffbd2e; }
    #output .ansi-blue { color: #5dade2; }
    #output .ansi-magenta { color: #c77dff; }
    #output .ansi-cyan { color: #5dd8d8; }
    #output .ansi-white { color: #e0e0f0; }
    #output .ansi-bold { font-weight: bold; }
  </style>
</head>
<body>
  <!-- 文件协议警告 -->
  <div id="fileWarning" class="file-warning">
    <h2>⚠️ 请用 HTTP 服务器打开</h2>
    <p>直接从文件管理器双击 HTML 会导致 WASM 无法加载。<br>
    请在终端运行：</p>
    <p><code>cd "G:\EmoScan Pro\Work-Simulator\源码"</code></p>
    <p><code>python -m http.server 8000</code></p>
    <p>然后浏览器打开 <code>http://localhost:8000/打工模拟器.html</code></p>
  </div>

  <!-- 终端 -->
  <div id="terminal" class="terminal-container">
    <div class="terminal-header">
      <div class="terminal-dots">
        <div class="terminal-dot dot-red"></div>
        <div class="terminal-dot dot-yellow"></div>
        <div class="terminal-dot dot-green"></div>
      </div>
      <div class="terminal-title">打工模拟器 v3.0 - Web版</div>
    </div>

    <!-- 加载覆盖层 -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner"></div>
      <div id="statusText">正在加载游戏引擎...</div>
    </div>

    <div id="output"><span style="color:#555;">正在加载游戏引擎...</span></div>

    <div class="input-area">
      <input id="inputField" type="text" placeholder="在此输入，按 Enter 发送..." disabled autocomplete="off" />
      <button id="sendBtn" disabled>发送</button>
    </div>
  </div>

  <script>
    "use strict";

    // ============================================================
    //  DOM 引用
    // ============================================================
    var outputEl  = document.getElementById('output');
    var inputEl   = document.getElementById('inputField');
    var sendBtn   = document.getElementById('sendBtn');
    var statusEl  = document.getElementById('statusText');
    var overlayEl = document.getElementById('loadingOverlay');
    var warnEl    = document.getElementById('fileWarning');
    var termEl    = document.getElementById('terminal');
    var termContainer = document.querySelector('.terminal-container');

    // ============================================================
    //  file:// 检测
    // ============================================================
    var isFileProtocol = window.location.protocol === 'file:';
    if (isFileProtocol) {
      warnEl.style.display = 'block';
      termEl.style.display = 'none';
    }

    // ============================================================
    //  ANSI → HTML 转换
    // ============================================================
    var ansiMap = {
      '0;30':  'ansi-reset', '30': 'ansi-reset',
      '0;31':  'ansi-red',   '31': 'ansi-red',
      '0;32':  'ansi-green', '32': 'ansi-green',
      '0;33':  'ansi-yellow','33': 'ansi-yellow',
      '0;34':  'ansi-blue',  '34': 'ansi-blue',
      '0;35':  'ansi-magenta','35': 'ansi-magenta',
      '0;36':  'ansi-cyan',  '36': 'ansi-cyan',
      '0;37':  'ansi-white', '37': 'ansi-white',
      '0':     'ansi-reset',
      '1':     'ansi-bold',
      '1;31':  'ansi-red ansi-bold',
      '1;32':  'ansi-green ansi-bold',
      '1;33':  'ansi-yellow ansi-bold',
      '1;34':  'ansi-blue ansi-bold',
      '1;35':  'ansi-magenta ansi-bold',
      '1;36':  'ansi-cyan ansi-bold',
      '1;37':  'ansi-white ansi-bold',
    };

    function ansiToHtml(text) {
      text = text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      text = text.replace(/\x1b\[2J\x1b\[H/g, '\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n');
      text = text.replace(/\x1b\[2J/g, '');
      text = text.replace(/\x1b\[\d*(?:[ABCDEFGKST])/g, '');
      text = text.replace(/\x1b\[\d*;\d*[Hf]/g, '');
      text = text.replace(/\x1b\[H/g, '');
      text = text.replace(/\x1b\[0;0H/g, '');
      text = text.replace(/\x1b\[1;1H/g, '');
      text = text.replace(/\x1b\[([\d;]*)m/g, function(match, code) {
        if (code === '' || code === '0') return '</span><span class="ansi-reset">';
        var cls = ansiMap[code];
        if (cls) return '</span><span class="' + cls + '">';
        return '';
      });
      return text;
    }

    var _firstOutput = true;
    function writeOutput(text) {
      var html = ansiToHtml(text);
      if (_firstOutput) {
        outputEl.innerHTML = html;
        _firstOutput = false;
      } else {
        outputEl.innerHTML += html;
      }
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    function writeHtml(html) {
      if (_firstOutput) {
        outputEl.innerHTML = html;
        _firstOutput = false;
      } else {
        outputEl.innerHTML += html;
      }
      outputEl.scrollTop = outputEl.scrollHeight;
    }

    // ============================================================
    //  输入队列系统 — 三层输入
    //  __inputQueue 是全局暴露的，供 patch 后的 JS 胶水代码读取
    // ============================================================
    var inputQueue = [];
    window.__inputQueue = inputQueue;

    function queueLine(text) {
      for (var i = 0; i < text.length; i++) {
        inputQueue.push(text.charCodeAt(i));
      }
      inputQueue.push('\n'.charCodeAt(0));
    }

    function queueChar(c) {
      inputQueue.push(c.charCodeAt(0));
    }

    // ============================================================
    //  Tier 1 — 全局键盘捕获
    // ============================================================
    document.addEventListener('keydown', function(e) {
      if (document.activeElement === inputEl) return;
      if (e.ctrlKey || e.altKey || e.metaKey) return;
      if (e.key === 'Enter') {
        queueChar('\n');
        e.preventDefault();
      } else if (e.key === 'Backspace') {
        e.preventDefault();
      } else if (e.key.length === 1) {
        queueChar(e.key);
        e.preventDefault();
      }
    });

    // ============================================================
    //  Tier 2 — 输入框提交
    // ============================================================
    function submitInput(text) {
      if (!text) text = '';
      queueLine(text);
      inputEl.value = '';
    }

    inputEl.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        submitInput(inputEl.value);
      }
    });

    sendBtn.addEventListener('click', function() {
      submitInput(inputEl.value);
    });

    document.addEventListener('click', function() {
      if (!inputEl.disabled) inputEl.focus();
    });

    // ============================================================
    //  localStorage 存档持久化
    //  游戏存档文件: worker_sim_save.dat（C++ 代码中的 SAVE_FILE）
    // ============================================================
    var SAVE_FILENAME = 'worker_sim_save.dat';

    // 从 localStorage 加载存档到虚拟 FS
    function loadSaveFromLocal() {
      try {
        var saved = localStorage.getItem(SAVE_FILENAME);
        if (saved && typeof FS !== 'undefined') {
          var binary = atob(saved);
          var arr = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) arr[i] = binary.charCodeAt(i);
          FS.writeFile(SAVE_FILENAME, arr);
          console.log('[Save] 已从 localStorage 恢复存档');
        }
      } catch(e) {
        console.log('[Save] 无存档或加载失败:', e.message);
      }
    }

    // 将虚拟 FS 的存档保存到 localStorage
    function saveSaveToLocal() {
      try {
        if (typeof FS !== 'undefined' && FS.analyzePath) {
          var info = FS.analyzePath(SAVE_FILENAME);
          if (info.exists) {
            var data = FS.readFile(SAVE_FILENAME, { encoding: 'binary' });
            var binary = '';
            for (var i = 0; i < data.length; i++) binary += String.fromCharCode(data[i]);
            localStorage.setItem(SAVE_FILENAME, btoa(binary));
            console.log('[Save] 存档已同步到 localStorage');
          }
        }
      } catch(e) {
        console.log('[Save] 同步失败:', e.message);
      }
    }

    // 定期从 FS 同步到 localStorage（每 5 秒）
    setInterval(saveSaveToLocal, 5000);

    // ============================================================
    //  Module 定义（给 Emscripten 用）
    // ============================================================
    var setStatus = function(text) {
      if (text) {
        statusEl.textContent = text;
      } else {
        overlayEl.classList.add('hidden');
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    };

    var Module = {
      print: function() {
        var text = Array.prototype.join.call(arguments, ' ');
        writeOutput(text + '\n');
      },
      printErr: function() {
        var text = Array.prototype.join.call(arguments, ' ');
        if (text.indexOf('stdio streams had content') !== -1) return;
        if (text.indexOf('you should set EXIT_RUNTIME') !== -1) return;
        writeHtml('\n<span style="color:#ff6b6b;">[错误] ' + ansiToHtml(text) + '</span>\n');
      },
      setStatus: setStatus,

      preRun: [
        function() {
          // 从 localStorage 恢复存档
          loadSaveFromLocal();
          if (typeof FS !== 'undefined') {
            FS.init(customStdin, null, null);
          }
          writeHtml('<span style="color:#555;">输入系统就绪 ✓</span>\n');
        }
      ],

      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        if (left) {
          setStatus('加载资源... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')');
        } else {
          setStatus('加载完成 ✓');
          setTimeout(function() {
            overlayEl.classList.add('hidden');
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
            // 加载完成后立即再同步一次存档（可能游戏加载时读了存档）
            setTimeout(saveSaveToLocal, 1000);
            writeHtml('<span style="color:#27c93f;">═══════ 打工模拟器 已启动 ═══════</span>\n\n');
          }, 300);
        }
      },

      canvas: (function() {
        var canvas = document.getElementById('canvas');
        if (!canvas) {
          canvas = document.createElement('canvas');
          canvas.id = 'canvas';
          canvas.style.display = 'none';
          document.body.appendChild(canvas);
        }
        return canvas;
      })()
    };

    // onRuntimeInitialized — 再覆盖一次 FS_stdin_getChar 做双保险
    Module.onRuntimeInitialized = function() {
      if (typeof FS_stdin_getChar !== 'undefined') {
        window.FS_stdin_getChar = function() {
          if (inputQueue.length > 0) {
            return inputQueue.shift();
          }
          return null;
        };
      }
      if (typeof FS_stdin_getChar_buffer !== 'undefined') {
        FS_stdin_getChar_buffer = [];
      }
      // 用户按 Ctrl+S 时手动同步存档
      document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.key === 's') {
          e.preventDefault();
          saveSaveToLocal();
          writeHtml('\n<span style="color:#27c93f;">💾 存档已保存到浏览器！</span>\n');
        }
      });
    };

    // Tier 3 — 自定义 stdin
    function customStdin() {
      if (inputQueue.length > 0) {
        return inputQueue.shift();
      }
      return null;
    }

    window.onerror = window.onunhandledrejection = function() {
      setStatus('发生错误，请查看控制台');
      overlayEl.classList.add('hidden');
    };

    window.Module = Module;
  </script>

  <script async type="text/javascript" src="打工模拟器.js"></script>
  <div id="canvas" style="display:none;"></div>
</body>
</html>
